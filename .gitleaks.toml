# Repo gitleaks config — auto-discovered by `gitleaks detect --source .`
# (CI: the `secrets-scan` job in .github/workflows/ci.yml, which additionally
# diffs findings against .gitleaks-baseline.json).
#
# proofs/keys/PROVENANCE.md records public artifact digests (the ptau blake2b
# digest and per-vkey SHA-256 fingerprints). Those hex lines trip the
# `generic-api-key` rule again under a fresh commit hash on every edit to the
# file: 44 of the 88 baseline entries are exactly this class, spread across
# eleven commits. Digests are not credentials — allowlist the file by path so
# the baseline stops growing on every touch.

title = "Olympus gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "proofs/keys/PROVENANCE.md — public artifact hash fingerprints, not secrets"
paths = [ '''^proofs/keys/PROVENANCE\.md$''' ]
