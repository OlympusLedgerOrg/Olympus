#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

# Standalone workspace root: vendored patch crate (wired via [patch.crates-io]).
# Declaring an empty `[workspace]` pins it as its own root so `cargo metadata`
# (run by the pre-commit fmt/clippy gate) never climbs into a parent workspace —
# required when committing from a nested git worktree.
[workspace]

[package]
edition = "2024"
# The lease code calls `File::try_lock`/`try_lock_shared`, stabilised in 1.89,
# so 1.88 could never actually build this crate. Set to 1.94 to match
# `src-tauri`, its only consumer — nothing builds this fork standalone, and no
# job tests a lower floor, so a smaller number would be an unverified claim.
rust-version = "1.94"
name = "pg-embed"
version = "1.0.0"
authors = ["Franz-Aliu Okunega <aokunega@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Run a Postgresql database locally on Linux, MacOS or Windows as part of another Rust application or test."
documentation = "https://docs.rs/pg-embed"
readme = "README.md"
keywords = [
    "database",
    "postgres",
    "postgresql",
    "embedded",
    "server",
]
categories = [
    "database",
    "database-implementations",
    "development-tools",
    "asynchronous",
]
license = "MIT/Apache-2.0"
repository = "https://github.com/faokunega/pg-embed"

[features]
default = ["rt_tokio_migrate"]
rt_tokio = [
    "tokio",
    "reqwest",
]
# Upstream declared this as a sibling of `rt_tokio` with the note "for now only
# rt_tokio or rt_tokio_migrate can be used", but nothing enforced that and it is
# not how this fork is consumed: `src-tauri` asks for `rt_tokio` *without*
# `default-features = false`, so both are on in every desktop build. Cargo
# features are additive, so the honest model is what was always true in practice —
# migrate is the plain runtime plus sqlx.
#
# Making the superset explicit is what lets one `[[test]]` per file cover both
# configurations (see below). It adds no dependency: `rt_tokio` contributes only
# tokio + reqwest, which this feature already enabled. The single `rt_tokio` cfg
# in the crate is the `not(any(...))` "pick a runtime" guard in lib.rs, which was
# already false whenever this feature was on.
rt_tokio_migrate = [
    "rt_tokio",
    "sqlx",
]

[lib]
name = "pg_embed"
path = "src/lib.rs"

# `auth` and `lifecycle` need only the plain runtime — neither file mentions sqlx.
# They used to be declared twice, once per runtime feature, because
# `required-features` is an AND-list with no way to say "either runtime". Cargo
# warned about it ("found to be present in multiple build targets") and built the
# same file twice whenever both features were on, which for this fork is always.
# Now that `rt_tokio_migrate` includes `rt_tokio`, one target per file is
# satisfied under either configuration.
[[test]]
name = "auth"
path = "tests/auth.rs"
required-features = ["rt_tokio"]

[[test]]
name = "common"
path = "tests/common.rs"

[[test]]
name = "database"
path = "tests/database.rs"
required-features = ["rt_tokio_migrate"]

[[test]]
name = "extension"
path = "tests/extension.rs"
required-features = ["rt_tokio_migrate"]

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
required-features = ["rt_tokio"]

[[test]]
name = "migration"
path = "tests/migration.rs"
required-features = ["rt_tokio_migrate"]

[dependencies.dirs]
version = "6.0"

[dependencies.hex]
version = "0.4"

[dependencies.log]
version = "0.4"

[dependencies.lzma-rs]
version = "0.3"

[dependencies.reqwest]
version = "0.13"
optional = true

[dependencies.sha2]
version = "0.10"

[dependencies.sqlx]
version = "0.9"
features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
]
optional = true

[dependencies.tar]
version = "0.4"

[dependencies.thiserror]
version = "2"

[dependencies.tokio]
version = "1"
features = ["full"]
optional = true

[dependencies.zip]
version = "8"

[target.'cfg(unix)'.dependencies.libc]
version = "0.2"

[target.'cfg(target_os = "windows")'.dependencies.windows-sys]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]

[dev-dependencies.env_logger]
version = "0.11"

[dev-dependencies.futures]
version = "0.3"

[dev-dependencies.serial_test]
version = "3"
features = ["file_locks"]

[dev-dependencies.tempfile]
version = "3"
