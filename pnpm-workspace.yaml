packages:
  - app/public-ui
  - proofs
allowBuilds:
  blake-hash: true
  blake3: true
  esbuild: true
# Force-resolve transitive deps to patched versions. pnpm reads workspace-wide
# `overrides` from here (a member package.json `overrides` block is ignored).
# Same discipline as auditConfig below: name the advisory, blast radius, and
# unblock condition.
overrides:
  # GHSA-vxpw-j846-p89q (WebSocket DoS via fragment-count bypass, HIGH),
  # GHSA-hm92-r4w5-c3mj (cross-origin routing via SOCKS5 pool reuse, HIGH),
  # GHSA-vmh5-mc38-953g — all patched in undici >=7.28.0. Dev/test only:
  # pulled in transitively via jsdom@29 (the vitest jsdom test environment),
  # never shipped in the desktop binary or the frontend bundle. jsdom@29.1.1
  # is the latest release and already allows the fix (its range is
  # undici@^7.25.0); the lockfile had merely pinned the older 7.27.2. Keep
  # the override inside jsdom's expected major (^7.28.0, not a bare
  # >=7.28.0 that would force the undici 8.x major onto jsdom). Drop this
  # override once jsdom pins undici >=7.28.0 directly.
  undici: "^7.28.0"
# Sole location for pnpm audit suppressions — do NOT also add a
# `pnpm.auditConfig` block to the root package.json. pnpm 9.5+/11 reads
# auditConfig from this workspace file; a package.json copy is a redundant,
# easily-stale duplicate (it was pruned for exactly that reason).
auditConfig:
  ignoreGhsas:
    # GHSA-mh99-v99m-4gvg (brace-expansion: DoS via unbounded expansion length,
    # HIGH). Dev/build-time only + no compatible fix: brace-expansion is pulled
    # exclusively by minimatch (v3/v5/v10) under the eslint/@eslint lint
    # toolchain (53 paths), never in the desktop binary or the frontend bundle.
    # The advisory's fixed range is a single continuous ">=5.0.8", but that flags
    # EVERY earlier major (1.x/2.x are all "<=5.0.7"), and 5.0.8 is API-
    # incompatible with the transitive minimatch@3 (`require('brace-expansion')`
    # is now an object, not a function -> "expand is not a function"), so there
    # is no override that both satisfies the audit and keeps eslint working.
    # The DoS vector is a maliciously-crafted glob; the only globs eslint
    # expands come from the repo's own trusted config, not attacker input, so
    # blast radius is nil here. Drop this suppression once the eslint toolchain
    # ships minimatch versions on brace-expansion >=5.0.8 (or the advisory adds
    # per-major patched versions).
    - "GHSA-mh99-v99m-4gvg"
    # GHSA-qwww-vcr4-c8h2 (react-router: RSC Mode CSRF Bypass Allows Action,
    # HIGH). NOT APPLICABLE + no upstream fix: the advisory only affects
    # react-router's RSC (React Server Components) framework mode. app/public-ui
    # is a client-side Vite SPA that mounts `<BrowserRouter>` (declarative mode,
    # see src/App.tsx) and never uses RSC / a server request handler, so the
    # CSRF-on-server-action vector cannot be reached. There is also no fix to
    # take: the patched version is react-router >=8.3.0, but react-router-dom —
    # the package the app actually depends on — has no release past 7.18.1
    # (all 7.x pull the vulnerable react-router 7.x), and forcing react-router
    # 8.3.0 under react-router-dom@7.18.1 (which pins react-router 7.18.1)
    # breaks the re-export surface. Drop this suppression once react-router-dom
    # ships a version resolving react-router >=8.3.0.
    - "GHSA-qwww-vcr4-c8h2"
