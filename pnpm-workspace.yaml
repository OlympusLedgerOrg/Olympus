packages:
  - app/public-ui
  - proofs
allowBuilds:
  blake-hash: true
  blake3: true
  esbuild: true
# Force-resolve transitive deps to patched versions. pnpm reads workspace-wide
# `overrides` from here (a member package.json `overrides` block is ignored).
# Same discipline as auditConfig below: name the advisory, blast radius, and
# unblock condition.
overrides:
  # GHSA-vxpw-j846-p89q (WebSocket DoS via fragment-count bypass, HIGH),
  # GHSA-hm92-r4w5-c3mj (cross-origin routing via SOCKS5 pool reuse, HIGH),
  # GHSA-vmh5-mc38-953g — all patched in undici >=7.28.0; and
  # GHSA-4cwx-7wf7-3272 (cross-user information disclosure + parse-time crash
  # via degenerate private cache directives, HIGH), patched in >=7.29.0, which
  # is why this floor is 7.29 rather than the 7.28 the first three needed.
  # Dev/test only: pulled in transitively via jsdom@29 (the vitest jsdom test
  # environment), never shipped in the desktop binary or the frontend bundle.
  # jsdom@29.1.1 is the latest release and already allows the fix (its range is
  # undici@^7.25.0); the lockfile had merely pinned the older 7.27.2. Keep
  # the override inside jsdom's expected major (^7.29.0, not a bare
  # >=7.29.0 that would force the undici 8.x major onto jsdom). Drop this
  # override once jsdom pins undici >=7.29.0 directly.
  undici: "^7.29.0"
  # GHSA-rgw5-rvv9-x895 (brace-expansion: DoS via unbounded intermediate
  # arrays, bypassing the CVE-2026-14257 mitigation, HIGH). Dev/build-time
  # only — brace-expansion reaches us solely through minimatch under the
  # eslint / typescript-eslint toolchain and (in `proofs`) snarkjs, never in
  # the desktop binary or the frontend bundle.
  #
  # Unlike the older GHSA-mh99-v99m-4gvg suppressed below, this advisory
  # publishes a patched version *per major line* (1.1.18 / 2.1.4 / 5.0.9), so
  # it is fixable by override where that one was not: each major stays on its
  # own line, so the transitive minimatch@3 keeps a 1.x brace-expansion whose
  # `require()` is still a function. A single `>=5.0.9` floor would drag
  # minimatch@3 onto the 5.x API and break eslint — the exact failure that
  # makes GHSA-mh99-v99m-4gvg unfixable.
  #
  # Drop each entry once the toolchain depends on the patched version directly.
  "brace-expansion@1": "^1.1.18"
  "brace-expansion@2": "^2.1.4"
  "brace-expansion@>=4": "^5.0.9"
# Sole location for pnpm audit suppressions — do NOT also add a
# `pnpm.auditConfig` block to the root package.json. pnpm 9.5+/11 reads
# auditConfig from this workspace file; a package.json copy is a redundant,
# easily-stale duplicate (it was pruned for exactly that reason).
auditConfig:
  ignoreGhsas:
    # (GHSA-mh99-v99m-4gvg, brace-expansion, was suppressed here. Its stated
    # unblock condition — "once the eslint toolchain ships minimatch versions on
    # brace-expansion >=5.0.8" — is now met by the per-major brace-expansion
    # overrides above, which force 1.1.18 / 2.1.4 / 5.0.9 on every path. With
    # those in place the advisory no longer matches anything, so the suppression
    # was removed rather than left as dead config: verified by deleting it and
    # re-running `pnpm audit --audit-level=high`, which still exits 0. If the
    # overrides are ever dropped, this suppression has to come back with them.)
    # GHSA-qwww-vcr4-c8h2 (react-router: RSC Mode CSRF Bypass Allows Action,
    # HIGH). NOT APPLICABLE + no upstream fix: the advisory only affects
    # react-router's RSC (React Server Components) framework mode. app/public-ui
    # is a client-side Vite SPA that mounts `<BrowserRouter>` (declarative mode,
    # see src/App.tsx) and never uses RSC / a server request handler, so the
    # CSRF-on-server-action vector cannot be reached. There is also no fix to
    # take: the patched version is react-router >=8.3.0, but react-router-dom —
    # the package the app actually depends on — has no release past 7.18.1
    # (all 7.x pull the vulnerable react-router 7.x), and forcing react-router
    # 8.3.0 under react-router-dom@7.18.1 (which pins react-router 7.18.1)
    # breaks the re-export surface. Drop this suppression once react-router-dom
    # ships a version resolving react-router >=8.3.0.
    - "GHSA-qwww-vcr4-c8h2"
