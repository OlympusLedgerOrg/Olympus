[package]
name = "olympus-manifest"
version = "0.1.0"
edition = "2021"
description = "Olympus dataset-manifest schema, Merkle commitment, and inclusion/exclusion/version-link proofs (ADR-0027)"
license = "Apache-2.0"
repository = "https://github.com/OlympusLedgerOrg/Olympus"
keywords = [ "cryptography", "merkle", "blake3", "dataset", "provenance" ]
# Internal workspace crate; the customer-facing surface is re-exported through
# the `clients/cli` binary and the Python SDK. Kept unpublished so `cargo deny`
# exempts its versionless path dep on `olympus-crypto`.
publish = false

[features]
default = [ "canonical", "parallel" ]
# JCS / RFC 8785 canonical serialization of a manifest so its committed
# content-hash is reproducible across implementations. On by default — the whole
# point of the manifest is a byte-stable commitment.
canonical = [ "olympus-crypto/canonical" ]
# Parallelizes the path-compressed SMT build for large manifests. The committed
# bytes are unchanged; this only changes how independent subtrees are computed.
parallel = [ "dep:rayon" ]

[dependencies]
# Domain-separated leaf/node hashing lives in olympus-crypto (ADR-0005/0027) so
# the manifest commitment stays parity-compatible with the cross-language
# verifiers. Never redefine the domain prefixes here.
olympus-crypto = { path = "../olympus-crypto", features = [ "smt" ] }
blake3 = "1"
hex = "0.4"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
thiserror = "2"
rayon = { version = "1", optional = true }
# Content-addressed commitments (RFC-0000 draft): text/utf8-nfc pins the
# Unicode version this crate implements (checked at compile time in
# content::canon), and metadata blinders come from the OS CSPRNG.
unicode-normalization = "0.1"
getrandom = "0.3"
# text/minhash-120 v1 (similarity companion): full case folding and the
# L*/N* character classes at Unicode 17.0.0. Pinned exactly because they name
# the profile's implementation_id; unicode-properties' version is checked at
# compile time, ICU's by the dev-dep cross-check below. Kept on the 2.2 line
# the workspace already locks so adding it moves no other ICU crate.
icu_casemap = "=2.2.0"
unicode-properties = { version = "=0.1.5", default-features = false, features = [
  "general-category",
] }

[dev-dependencies]
# Cross-checks that ICU 2.2's data (shared by icu_casemap) is Unicode 17.0.0.
icu_properties = "=2.2.0"
serde_json = "1"
