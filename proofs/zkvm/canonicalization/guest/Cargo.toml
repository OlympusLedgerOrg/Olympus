[package]
name = "olympus-canonicalization-guest"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
olympus-crypto = { path = "../../../../crates/olympus-crypto", features = [ "canonical" ] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = [ "std" ] }

# Keep the guest isolated from the desktop workspace. It is compiled for the
# RISC Zero rv32im target by `cargo risczero`, never by ordinary workspace CI.
[workspace]
