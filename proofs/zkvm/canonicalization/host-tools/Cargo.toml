[package]
name = "olympus-canonicalization-host-tools"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
olympus-crypto = { path = "../../../../crates/olympus-crypto", features = [ "canonical" ] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = [ "std", "prove", "disable-dev-mode" ] }
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"

# This Linux-only release tool is intentionally isolated from the desktop
# workspace and its Tauri/system-library dependency graph.
[workspace]
