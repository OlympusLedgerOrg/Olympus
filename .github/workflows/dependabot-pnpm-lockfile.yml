name: Dependabot pnpm lockfile

# Dependabot's npm ecosystem updates package.json but cannot refresh
# pnpm-lock.yaml, so every JS bump lands with a stale lockfile and CI's
# `pnpm install --frozen-lockfile` step fails. This workflow runs on
# dependabot PRs that touch a workspace package.json, regenerates the
# lockfile, and pushes it back to the PR branch.
#
# pull_request_target runs in the base repo context with write access,
# which is required to push to the PR head. The `actor == dependabot[bot]`
# guard plus the `--lockfile-only` install (which does not execute install
# scripts) keeps this safe against arbitrary PR contents.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "app/public-ui/package.json"
      - "verifiers/javascript/package.json"
      - "proofs/package.json"
      - "package.json"

jobs:
  refresh-lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Require an Olympus-owned Dependabot branch
        env:
          HEAD_REPOSITORY_OWNER: ${{ github.event.pull_request.head.repo.owner.login }}
        run: |
          if [ "$HEAD_REPOSITORY_OWNER" != "OlympusLedgerOrg" ]; then
            echo "::error::Refusing to check out a pull request from repository owner $HEAD_REPOSITORY_OWNER"
            exit 1
          fi

      - name: Checkout PR branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "11.1.2"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit and push if lockfile changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -z "$(git status --porcelain pnpm-lock.yaml)" ]; then
            echo "pnpm-lock.yaml already up to date."
            exit 0
          fi
          git config user.name "dependabot-pnpm-lockfile[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh pnpm-lock.yaml"
          git push
          # Events emitted by GITHUB_TOKEN do not recursively start workflows.
          # workflow_dispatch is the documented exception, so explicitly run
          # every merge/release-relevant suite against the new lockfile SHA.
          for workflow in \
            ci.yml \
            windows-ci.yml \
            macos-ci.yml \
            coverage.yml \
            codeql.yml \
            react-compiler-smoke.yml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
          done
          gh workflow run dependabot-review-gate.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$HEAD_REF" \
            -f pr_number="$PR_NUMBER"
