# SPDX-License-Identifier: Apache-2.0

name: Canonicalization zkVM guest

on:
  pull_request:
    paths:
      - ".github/workflows/zkvm-guest.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/olympus-crypto/**"
      - "proofs/zkvm/**"
      - "src-tauri/Cargo.toml"
      - "src-tauri/src/api/zk/**"
      - "src-tauri/src/zk/**"
  workflow_dispatch:

concurrency:
  group: canonicalization-zkvm-guest-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reproducible-guest:
    name: rebuild pinned guest ELF
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install pinned RISC Zero build tools
        run: |
          cargo install rzup --version 0.5.1 --locked \
            --no-default-features --features cli,install
          rzup install rust 1.88.0
          cargo install cargo-risczero --version 3.0.5 --locked \
            --no-default-features --features docker

      - name: Rebuild canonicalization guest
        run: bash proofs/zkvm/build_canonicalization_guest.sh

      - name: Upload rebuilt guest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olympus-canonicalization-guest
          path: |
            proofs/zkvm/canonicalization/olympus_canonicalization_guest.elf
            proofs/zkvm/canonicalization/olympus_canonicalization_guest.id
          if-no-files-found: error
          retention-days: 7

      - name: Verify committed guest is reproducible
        run: >-
          git diff --exit-code --
          proofs/zkvm/canonicalization/olympus_canonicalization_guest.elf
          proofs/zkvm/canonicalization/olympus_canonicalization_guest.id

  linux-host-prover:
    name: type-check Linux local prover
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust stable
        run: rustup toolchain install stable --no-self-update --profile minimal && rustup default stable

      - name: Install Linux system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Check verifier and local prover integration
        run: >-
          cargo check --locked -p olympus-desktop --lib
          --no-default-features --features zkvm-prover

  measure-and-fixture:
    name: measure cycles and generate receipt fixture
    needs: reproducible-guest
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download rebuilt guest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: olympus-canonicalization-guest
          path: proofs/zkvm/canonicalization

      - name: Measure deterministic adversarial cases
        id: measure
        continue-on-error: true
        run: >-
          env -u RISC0_DEV_MODE cargo run --locked --release
          --manifest-path proofs/zkvm/canonicalization/host-tools/Cargo.toml --
          measure
          proofs/zkvm/canonicalization/olympus_canonicalization_guest.elf
          proofs/zkvm/canonicalization/olympus_canonicalization_guest.id
          proofs/zkvm/canonicalization/cycle-report.json
          33554432

      - name: Generate real succinct receipt fixture
        id: fixture
        continue-on-error: true
        run: >-
          env -u RISC0_DEV_MODE cargo run --locked --release
          --manifest-path proofs/zkvm/canonicalization/host-tools/Cargo.toml --
          fixture
          proofs/zkvm/canonicalization/olympus_canonicalization_guest.elf
          proofs/zkvm/canonicalization/olympus_canonicalization_guest.id
          proofs/zkvm/canonicalization/receipt-fixture.json

      - name: Upload cycle report and receipt fixture
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olympus-canonicalization-validation
          path: |
            proofs/zkvm/canonicalization/cycle-report.json
            proofs/zkvm/canonicalization/receipt-fixture.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce complete measurement and fixture generation
        if: ${{ always() && (steps.measure.outcome != 'success' || steps.fixture.outcome != 'success') }}
        run: exit 1
