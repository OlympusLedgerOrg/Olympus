name: Olympus CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect which areas of the repo changed ───────────────────────────────────
  # Every other job below conditions on these outputs so PRs only run the
  # checks they could plausibly break. Pure docs PRs skip everything heavy.
  # The "ci" filter forces all jobs to run whenever the workflow itself
  # changes, so workflow edits get full coverage.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-app: ${{ steps.filter.outputs.rust-app }}
      rust-verifier: ${{ steps.filter.outputs.rust-verifier }}
      rust-cli: ${{ steps.filter.outputs.rust-cli }}
      python-client: ${{ steps.filter.outputs.python-client }}
      crypto-fuzz: ${{ steps.filter.outputs.crypto-fuzz }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deps: ${{ steps.filter.outputs.deps }}
      proofs: ${{ steps.filter.outputs.proofs }}
      proofs-js: ${{ steps.filter.outputs.proofs-js }}
      js-verifier: ${{ steps.filter.outputs.js-verifier }}
      docs: ${{ steps.filter.outputs.docs }}
      agent-docs: ${{ steps.filter.outputs.agent-docs }}
      tooling: ${{ steps.filter.outputs.tooling }}
      # A manual dispatch is an explicit request for the complete suite, even
      # when the most recent commit touched only docs.
      ci: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci == 'true' }}
    steps:
      # The one checkout in this file that deliberately keeps its credentials.
      # Every other job strips them because it builds or runs PR-controlled
      # code; this job runs none — the only thing that executes is the
      # SHA-pinned paths-filter action below. Stripping them here would buy no
      # isolation and risks breaking the `push:` runs, where paths-filter
      # resolves the base ref itself rather than via the pull-request API.
      # Revisit if this job ever gains a `run:` step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            rust-app:
              - 'src-tauri/**'
              - 'crates/**'
              - 'pg-embed-local/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.config/nextest.toml'
              - 'clippy.toml'
              - 'proofs/keys/**'
              - 'proofs/vendor/**'
              - 'proofs/circuits/**'
              - 'proofs/setup_circuits.sh'
              - 'proofs/package.json'
              - 'proofs/package-lock.json'
              - 'fuzz/**'
              - 'verifiers/test_vectors/**'
              - 'verifiers/javascript/rust_eddsa_vectors.json'
              - 'app/public-ui/src/lib/redactionGeometry.vectors.json'
              - '.github/actions/**'
              # Dev tooling that runs against the Rust build — broken hooks
              # or wrappers should fail CI before contributors hit them.
              - '.githooks/**'
              - 'scripts/**'
            rust-verifier:
              - 'verifiers/rust/**'
              - 'verifiers/test_vectors/**'
            rust-cli:
              - 'clients/cli/**'
              - 'crates/olympus-manifest/**'
              - 'crates/olympus-crypto/**'
            python-client:
              - 'clients/python/**'
              - 'crates/olympus-manifest/**'
              - 'crates/olympus-crypto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            crypto-fuzz:
              - 'fuzz/**'
              - 'crates/olympus-crypto/**'
              - 'crates/light-poseidon/**'
              - 'crates/babyjubjub-permissive/**'
            docs:
              - 'docs/adr/**'
              - 'scripts/check_adr_index.mjs'
            agent-docs:
              - 'CLAUDE.md'
              - 'AGENTS.md'
              - 'CODEX.md'
              - 'tools/wiserepo/**'
            tooling:
              - '.license-header-baseline'
              - '.prettierignore'
              - '.prettierrc.json'
              - 'taplo.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/check-license-headers.mjs'
              - '**/*.circom'
              - '**/*.cjs'
              - '**/*.css'
              - '**/*.js'
              - '**/*.json'
              - '**/*.mjs'
              - '**/*.ps1'
              - '**/*.py'
              - '**/*.rs'
              - '**/*.sh'
              - '**/*.sql'
              - '**/*.toml'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.yaml'
              - '**/*.yml'
            frontend:
              - 'app/public-ui/**'
              - '.pnpmfile.cjs'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            deps:
              - '.github/dependabot.yml'
              - '.pnpmfile.cjs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/pnpm-lock.yaml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'cargo-audit-baseline.txt'
              - '**/cargo-audit-ignore.txt'
              - 'deny.toml'
              - 'supply-chain/**'
            proofs:
              - 'proofs/circuits/**'
              - 'proofs/vendor/**'
              - 'proofs/circomspect.sh'
              - 'proofs/circomspect_baseline.txt'
              - 'proofs/formal_verify.sh'
            proofs-js:
              - 'proofs/package.json'
              - 'proofs/package-lock.json'
              - 'proofs/safe-jsonpath/**'
              - 'proofs/test/**'
              - 'proofs/test_inputs/**/*.js'
              - 'proofs/*.js'
            js-verifier:
              - 'verifiers/javascript/**'
              # The JS conformance suite loads verifiers/test_vectors/vectors.json,
              # so a vectors-only change must re-run it (parity with rust-verifier).
              - 'verifiers/test_vectors/**'
            ci:
              - '.github/actions/**'
              - '.github/workflows/**'

  # ── ADR documentation drift gate ─────────────────────────────────────────────
  docs-adr:
    name: ADR index check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check ADR index/status drift
        run: node scripts/check_adr_index.mjs

  # ── AGENTS.md drift gate (wiserepo) ──────────────────────────────────────────
  # CLAUDE.md and AGENTS.md carry the same guidance for two different
  # assistants and have drifted apart for real in this repo before (commit
  # 4f5e270f). wiserepo's own unit tests (structural-parity check, path-guard)
  # run unconditionally; the actual drift check needs a model API key and is
  # a soft gate — see the step below for why.
  docs-agent-sync:
    name: AGENTS.md drift check (wiserepo)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.agent-docs == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: tools/wiserepo/package-lock.json

      - name: Install wiserepo dependencies
        run: npm ci
        working-directory: tools/wiserepo

      - name: wiserepo unit tests
        run: npm test
        working-directory: tools/wiserepo

      - name: Check AGENTS.md is in sync with CLAUDE.md
        env:
          # SECURITY: only exposed on `push` (i.e. post-merge on a protected
          # branch), never on `pull_request`. `pull_request` checks out the
          # PR head and runs `node bin/sync-agent-docs.mjs`, which imports
          # code FROM that checkout — a same-repository PR could modify
          # backend.mjs (or anything else executed in this step) to read
          # process.env.ANTHROPIC_API_KEY and exfiltrate it, regardless of
          # whether the model is ever actually called. Gating on event_name
          # here, rather than moving this to `pull_request_target` (which
          # would keep the secret but run trusted workflow code against an
          # untrusted checkout — a well-known worse mistake), means a PR run
          # always sees an empty key and exercises only the two model-free
          # paths: the unit tests above, and sync-agent-docs.mjs's own
          # structural short-circuit (see that script — it skips the model
          # entirely when the committed AGENTS.md already satisfies parity
          # against a content-hash-verified CLAUDE.md). Real drift beyond
          # that circuit is caught by the post-merge push run instead.
          ANTHROPIC_API_KEY: ${{ github.event_name == 'push' && secrets.WISEREPO_ANTHROPIC_API_KEY || '' }}
        run: |
          # This is a soft gate, not a hard one: sync-agent-docs.mjs exits 2
          # (non-blocking) when the model backend is unavailable — no repo
          # secret configured, network hiccup, timeout — and only exits 1
          # (blocking, fails this job) when the model DID respond but
          # dropped or reordered content relative to CLAUDE.md, or when
          # --check finds genuine drift. See the exit code contract
          # documented at the top of that script.
          #
          # The `if node ...; then / else rc=$? / fi` capture below is
          # required, not decorative: a bare `node bin/sync-agent-docs.mjs
          # --check` as the last command in this step would let its exit
          # code become the step's exit code directly, and GitHub Actions
          # fails the step on ANY nonzero code — including exit 2, which the
          # whole point of this contract is to treat as non-blocking.
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
              echo "::notice::AGENTS.md drift is checked structurally (no model call) on pull_request; the model-backed check runs post-merge on push to main."
            else
              echo "::warning::WISEREPO_ANTHROPIC_API_KEY repo secret is not set — AGENTS.md drift is NOT being checked in CI. Set the secret to enable this gate (see tools/wiserepo/README.md)."
            fi
          fi
          if node bin/sync-agent-docs.mjs --check; then
            exit 0
          else
            rc=$?
            if [ "$rc" -eq 2 ]; then
              echo "::warning::wiserepo backend unavailable; AGENTS.md drift was not checked."
              exit 0
            fi
            exit "$rc"
          fi
        working-directory: tools/wiserepo

  # ── Formatting + per-file license headers ───────────────────────────────────
  repo-tooling:
    name: formatting + license headers
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tooling == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.1.2"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run formatting and license-header checks
        run: pnpm tooling:check

  # ── Static analysis (Semgrep) ────────────────────────────────────────────────
  # Runs on every push/PR regardless of what changed -- like secrets-scan,
  # deliberately not gated behind the `changes` filter, because
  # .semgrep/olympus-rules.yml encodes repo-wide invariants (CLAUDE.md's
  # "Critical Invariants" section) that any Rust change anywhere could
  # violate, not just changes in one filtered area.
  #
  # Two configs run together: Semgrep's default "auto" ruleset (broad,
  # general-purpose findings) and .semgrep/olympus-rules.yml (this repo's
  # own invariants -- e.g. "every SMT write goes through
  # NodeBackend::begin_write", "the ledger is insert-only"). Every rule in
  # the custom file was verified against a synthetic violation before being
  # committed -- see that file's own header comment for the two ways an
  # earlier draft looked correct while silently matching nothing.
  semgrep:
    name: static analysis (semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      # Pinned, not `pip install semgrep` -- an unpinned install drifting
      # between runs is exactly the kind of nondeterminism this repo's other
      # CI-tooling comments (cargo-cyclonedx, gitleaks) warn against.
      - name: Install Semgrep
        run: pip install semgrep==1.168.0

      # `--config auto` was tried first and rejected: it refuses to run with
      # metrics off ("Cannot create auto config when metrics are off"),
      # because it phones home to Semgrep's registry to pick rules based on
      # repo metadata. That conflicts with the metrics=off / no-unnecessary-
      # network-calls stance this repo already takes elsewhere (see
      # tools/wiserepo's trust-boundary README section).
      #
      # `.semgrep/p-rust-snapshot.yml` is a VENDORED, committed copy of the
      # public `p/rust` registry pack (`curl -fsSL https://semgrep.dev/c/p/rust`),
      # not a live `--config p/rust` fetch. The registry path is a mutable
      # pointer -- Semgrep provides no version/commit pinning for it, so
      # `--config p/rust` means every CI run scans against whatever the
      # ruleset currently is, silently, with no repository commit recording
      # the change. That's the opposite of how every other tool pin in this
      # file works (exact SHAs, exact toolchain versions, exact tool
      # versions). Re-vendor deliberately with the same curl command when you
      # want to pick up upstream rule changes -- that's a normal, reviewable
      # diff, not a standing exception to the pin-everything discipline.
      #
      # Matches this scan's scope -- the codebase's dominant language, where
      # clippy has no equivalent security-pattern matching. TS/JS is
      # intentionally out of scope here: eslint + tsc + prettier already gate
      # app/public-ui and tools/wiserepo (see repo-tooling and the frontend
      # jobs); add a JS Semgrep pack later if a real gap shows up.
      #
      # Four rule IDs are excluded, triaged the same way cargo-audit-baseline.txt
      # and .gitleaks-baseline.json triage known noise in this repo -- run
      # against the real tree before excluding anything, not reflexively:
      #   * rust.lang.security.unsafe-usage.unsafe-usage (146 of 153 raw
      #     findings) -- flags every `unsafe` block unconditionally. That is
      #     an audit-checklist item ("did you use unsafe, go look"), not a
      #     confirmed-bug pattern, and this codebase has legitimate unsafe in
      #     vendored/patched crates (light-poseidon, babyjubjub-permissive)
      #     and pg-embed's process handling. A blocking CI gate needs a
      #     pattern that's wrong when it fires, not a reminder to read code
      #     that's already been reviewed.
      #   * rust.lang.security.current-exe.current-exe -- fires on
      #     pg-embed-local's std::env::current_exe() calls, which it uses
      #     legitimately to locate its own bundled Postgres binaries.
      #   * rust.lang.security.args-os.args-os / rust.lang.security.args.args
      #     -- fire on ordinary CLI argument parsing in binary entry points
      #     (olympus_smt_demo, the zkVM host-tools binary,
      #     verify_ceremony_bundle) with no more specific pattern attached.
      # Re-run without --exclude-rule locally after re-vendoring the snapshot
      # to confirm this list is still the right one before trusting a green CI.
      - name: Run Semgrep (vendored p/rust snapshot)
        run: |
          # `--exclude-rule` values are prefixed `semgrep.` here, not the
          # bare `rust.lang.security....` IDs the same rules have when
          # fetched live via `--config p/rust`. Loading a LOCAL config file
          # namespaces every rule ID with the config's basename -- verified
          # directly: the bare IDs silently excluded nothing (11 rules ran,
          # 153 findings), the `semgrep.`-prefixed IDs correctly excluded
          # all four (7 rules ran, 0 findings). Same class of bug as the
          # metavariable-regex quoting issue in .semgrep/olympus-rules.yml's
          # own header comment -- looked right, matched nothing, caught by
          # testing the actual command rather than trusting the rename.
          semgrep scan --config .semgrep/p-rust-snapshot.yml --error --metrics=off \
            --exclude-rule semgrep.rust.lang.security.unsafe-usage.unsafe-usage \
            --exclude-rule semgrep.rust.lang.security.current-exe.current-exe \
            --exclude-rule semgrep.rust.lang.security.args-os.args-os \
            --exclude-rule semgrep.rust.lang.security.args.args

      # .semgrep/fixtures/ deliberately contains synthetic violations (see
      # that directory's own file headers) -- excluded here so this
      # production scan doesn't permanently fail on its own test fixtures;
      # the next step scans them on purpose and asserts the expected count.
      - name: Run Semgrep (Olympus custom invariant rules)
        run: |
          semgrep scan --config .semgrep/olympus-rules.yml --error --metrics=off \
            --exclude '.semgrep/fixtures'

      # Regression test for the rules themselves: semgrep's own --test
      # fixture runner (semgrep --test) crashes with an internal IndexError
      # in the pinned 1.168.0 CLI whenever the config file and target
      # directory sit at different relative depths (reproduced locally
      # before deciding not to depend on it), so this asserts expected
      # finding counts directly via --json instead. A rule change that
      # silently stops matching (the exact failure mode this file's own
      # header comment describes from an earlier draft) drops the
      # violations count and fails this step; a rule change that starts
      # over-matching an intentionally-benign case fails the zero-findings
      # check below.
      - name: Validate custom rule fixtures (regression test)
        run: |
          set -euo pipefail

          violations_json=$(semgrep scan --config .semgrep/olympus-rules.yml --metrics=off --json \
            .semgrep/fixtures/smt_write_violations.rs \
            .semgrep/fixtures/ledger_delete_violations.rs \
            .semgrep/fixtures/src-tauri/src/smt/todo_violations.rs)

          smt_write_count=$(echo "$violations_json" | jq '[.results[] | select(.check_id | endswith("smt-write-outside-backend"))] | length')
          ledger_delete_count=$(echo "$violations_json" | jq '[.results[] | select(.check_id | endswith("ledger-delete-violates-insert-only"))] | length')
          todo_count=$(echo "$violations_json" | jq '[.results[] | select(.check_id | endswith("crypto-todo-fixme"))] | length')

          echo "smt-write-outside-backend: $smt_write_count (expect 5)"
          echo "ledger-delete-violates-insert-only: $ledger_delete_count (expect 6)"
          echo "crypto-todo-fixme: $todo_count (expect 6)"

          if [ "$smt_write_count" -ne 5 ] || [ "$ledger_delete_count" -ne 6 ] || [ "$todo_count" -ne 6 ]; then
            echo "::error::Custom Semgrep rule fixture counts drifted from the pinned expectation -- a rule pattern change silently stopped (or started over-) matching. See .semgrep/fixtures/ and update the expected counts here only after confirming the new counts are correct, not just different."
            exit 1
          fi

          allowed_count=$(semgrep scan --config .semgrep/olympus-rules.yml --metrics=off --json \
            .semgrep/fixtures/smt_write_allowed.rs \
            .semgrep/fixtures/ledger_delete_allowed.rs \
            .semgrep/fixtures/src-tauri/src/smt/todo_allowed.rs \
            | jq '.results | length')

          echo "allowed fixtures: $allowed_count (expect 0)"
          if [ "$allowed_count" -ne 0 ]; then
            echo "::error::A custom Semgrep rule fired on a fixture explicitly marked as benign -- see .semgrep/fixtures/*_allowed.rs"
            exit 1
          fi

  # ── Public API drift (olympus-crypto) ────────────────────────────────────────
  # olympus-crypto carries the ADR-0005 leaf-hash layout and the other
  # constants CLAUDE.md lists as "four independent implementations to keep in
  # step" -- an accidental rename or signature change here is exactly the
  # silent-drift class of bug that section exists to prevent, and nothing
  # else in CI would catch a change that compiles fine but alters the crate's
  # public surface. `publish = false` in its Cargo.toml means it is never on
  # crates.io, so cargo-semver-checks' default "compare against last
  # published version" has nothing to compare against -- --baseline-rev
  # origin/main compares against the base branch instead. --all-features is
  # required: this crate's ADR-0005 constants and SMT/canonical/poseidon API
  # sit behind feature flags, and without --all-features semver-checks would
  # only see the default-feature subset and miss a breaking change gated
  # behind e.g. `smt` or `canonical`.
  #
  # Verified both directions before wiring this in, not just the happy path:
  # renamed a real public const (OLY_STRUCT_MARKER) locally and confirmed
  # semver-checks reports it as a breaking removal with a nonzero exit
  # (100), then reverted and confirmed a clean tree exits 0.
  crypto-semver-checks:
    name: public API drift (olympus-crypto)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0

      - name: Cache cargo-semver-checks binary
        id: cache-semver-checks
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-semver-checks
          # Pin invariant matches cargo-cyclonedx / cargo-mutants / cargo-deny
          # elsewhere in this file: cache key encodes the exact version, bump
          # deliberately.
          key: cargo-semver-checks-0.50.0

      - name: Install cargo-semver-checks
        if: steps.cache-semver-checks.outputs.cache-hit != 'true'
        run: cargo install cargo-semver-checks --locked --version 0.50.0

      - name: Check olympus-crypto public API against origin/main
        run: |
          cargo semver-checks check-release \
            --package olympus-crypto \
            --baseline-rev origin/main \
            --all-features

  # ── Rust reference verifier ──────────────────────────────────────────────────
  rust-verifier:
    name: Rust verifier conformance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-verifier == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in git config while running PR-controlled
          # code. Every build step in this job executes it — `cargo nextest`,
          # the doctests, and now `cargo clippy` (build scripts and proc macros
          # run during the type-check pass). Matches rust-lint / federation-check.
          persist-credentials: false

      - name: Install Rust stable
        run: rustup toolchain install stable --no-self-update && rustup default stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: verifiers/rust -> target

      - name: Run Rust verifier tests
        working-directory: verifiers/rust
        run: cargo nextest run --locked

      - name: Run Rust verifier doctests
        working-directory: verifiers/rust
        run: cargo test --locked --doc

      # `verifiers/rust` is its own Cargo root and is workspace-excluded, so the
      # repo-wide `cargo fmt --all` / `cargo clippy --workspace` gates in the
      # rust-lint job never reach it — they enumerate workspace members. Until
      # now nothing linted the offline court-evidence verifier at all, while the
      # standalone CLI next door has had both gates all along. `--all-targets` so
      # the benches, the `verify` binary, and the conformance tests are covered
      # too; clippy stops at the first failing target, so anything less would
      # mask findings behind whichever one fails first.
      - name: Check Rust verifier formatting
        working-directory: verifiers/rust
        run: cargo fmt --all --check

      - name: Lint Rust verifier targets
        working-directory: verifiers/rust
        run: cargo clippy --locked --all-targets -- -D warnings

  # ── JavaScript reference verifier ────────────────────────────────────────────
  # Parity with the Rust verifier conformance job above. Without this the JS
  # verifier's crypto deps (@noble/curves, @noble/hashes, circomlibjs,
  # blake3-wasm) are only SBOM'd / npm-audited, never actually exercised — so a
  # Dependabot bump that breaks them at runtime can pass green (e.g. a
  # @noble/curves major that drops a subpath export). Run its full conformance
  # suite (canonical-JSON 780-vector parity, BJJ vectors, checkpoint verify).
  js-verifier:
    name: JS verifier conformance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.js-verifier == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in git config while running PR-controlled
          # `npm ci`/`npm test`. Matches macos-ci.yml.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: Install + run JS verifier conformance tests
        working-directory: verifiers/javascript
        run: |
          npm ci
          npm test

  # ── Standalone Rust client CLI ──────────────────────────────────────────────
  # clients/cli is its own Cargo workspace, so none of the root --workspace
  # commands discover its unit or integration targets.
  rust-cli:
    name: Rust client CLI tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-cli == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: clients/cli -> clients/cli/target

      - name: Run CLI unit + integration tests
        run: cargo nextest run --locked --manifest-path clients/cli/Cargo.toml --all-features

      - name: Check CLI formatting
        run: cargo fmt --manifest-path clients/cli/Cargo.toml --all --check

      - name: Lint CLI targets
        run: cargo clippy --locked --manifest-path clients/cli/Cargo.toml --all-targets --all-features -- -D warnings

  # ── Python verifier/client SDK ──────────────────────────────────────────────
  # This is a verify-only cross-language client, not a Python service. Test the
  # declared lower Python bound and the current stable line, and keep its
  # committed parity vectors tied to the Rust source of truth.
  python-client:
    name: Python client tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python-client == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install client + test dependencies
        run: python -m pip install -e "./clients/python[dev]"

      - name: Run Python parity and adversarial tests
        run: python -m pytest -q clients/python/tests

      - name: Install Rust stable for parity-vector drift check
        if: matrix.python-version == '3.14'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0

      - name: Verify committed Python vectors match Rust
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          cargo run --locked -p olympus-manifest --example gen_python_vectors > generated-python-vectors.json
          diff -u clients/python/tests/vectors.json generated-python-vectors.json

  # ── Proof-tooling JavaScript tests ──────────────────────────────────────────
  proofs-js:
    name: proof helper tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proofs-js == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: proofs/package-lock.json

      - name: Install proof-tooling dependencies
        run: npm ci --ignore-scripts --prefix proofs

      - name: Run proof helper tests
        run: npm run test:jsonpath --prefix proofs

  # ── Rust lint gate (rustfmt + clippy) ────────────────────────────────────────
  # CI enforcement of the same commands the .githooks/pre-push hook runs
  # locally. Without this gate the audit-critical clippy.toml rules (e.g. the
  # disallowed-methods guard that keeps callers off ark_snark::Groth16::prove —
  # root cause of #1011) only fire for contributors who opted into the hooks.
  # Default features (= prover) so the lint surface matches production builds;
  # `--all-targets` lints tests/benches/examples too.
  rust-lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in git config while running PR-controlled
          # `cargo clippy` (build scripts execute). Matches federation-check.
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: Install Linux system dependencies
        # src-tauri links GTK/webkit even for clippy's type-check pass. Same
        # apt hardening (retry loop + per-call timeout) as the desktop jobs
        # (see #1058).
        timeout-minutes: 50
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          for i in 1 2 3; do
            if sudo -E timeout 600 apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              mold; then
              break
            fi
            echo "apt-get install attempt $i failed; recovering and sleeping 10 s"
            sudo -E timeout 120 dpkg --configure -a || true
            sleep 10
            if [ "$i" = "3" ]; then
              echo "apt-get install failed 3 times — aborting"
              exit 1
            fi
          done

      - name: cargo clippy (workspace, -D warnings)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # ── Federation feature compiles + tests ──────────────────────────────────────
  # The desktop test jobs build only `--features prover`, so the arti/Tor stack
  # (arti-client, tor-rtcompat, tor-hsservice, …) and src-tauri/src/federation/
  # are otherwise NEVER compiled in CI — a tor-* dependency bump can pass green
  # while failing to compile under `--features federation` (e.g. #1198, where
  # two tor-rtcompat versions' Runtime types don't unify). Type-check first for
  # a focused diagnostic, then run Olympus's federation library tests and
  # equivocation integration target without pulling every dependency's tests.
  federation-check:
    name: federation feature compiles + tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in git config while running PR-controlled
          # `cargo check` (build scripts execute). Matches macos-ci.yml.
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system dependencies
        # Mirrors the tauri-unit job: src-tauri links GTK/webkit even for a
        # `cargo check`. Same apt hardening (retry loop + per-call timeout) as
        # the desktop jobs (see #1058).
        timeout-minutes: 50
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          for i in 1 2 3; do
            if sudo -E timeout 600 apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              mold; then
              break
            fi
            echo "apt-get install attempt $i failed; recovering and sleeping 10 s"
            sudo -E timeout 120 dpkg --configure -a || true
            sleep 10
            if [ "$i" = "3" ]; then
              echo "apt-get install failed 3 times — aborting"
              exit 1
            fi
          done

      - name: cargo check (federation feature)
        run: cargo check --locked -p olympus-desktop --no-default-features --features federation

      - name: Federation unit + equivocation tests
        run: >-
          cargo nextest run --locked --profile ci -p olympus-desktop
          --no-default-features --features federation
          --lib --test federation_equivocation

  # ── Vendored pg_embed library unit tests + lints ─────────────────────────────
  # (The job's `name:` still says "unit tests" only. Left alone deliberately:
  # renaming a check breaks any branch-protection rule that requires it by name,
  # which fails closed as a check that never reports.)
  # `pg-embed-local` is workspace-excluded (rationale in the root Cargo.toml),
  # which also meant *none* of its library unit tests were ever compiled by CI,
  # let alone run: `cargo test -p pg-embed` refuses ("requires dev-dependencies
  # and is not a member of the workspace") and no other job targets its
  # manifest. Three real concurrency defects in this startup-critical tree
  # shipped undetected as a direct result (#1505, #1506, #1507).
  #
  # This does NOT reopen what the exclusion was protecting against. That
  # rationale is specifically the crate's lifecycle / database / doctest
  # targets, each of which downloads and spawns a real PostgreSQL with a
  # startup deadline that loses the CPU race on Windows. `--lib` touches none
  # of them — no library unit test here spawns a cluster, and the whole suite
  # runs in ~4 s.
  #
  # `--no-default-features --features rt_tokio` drops the optional sqlx tree,
  # which keeps the build small and skips nothing: of the test attributes in
  # `src/`, none are gated on `rt_tokio_migrate`.
  #
  # Runs on BOTH Linux and Windows, because the two legs execute disjoint code
  # and a Linux-only job proved unable to see half of it. The `#[cfg(target_os =
  # "windows")]` items are not compiled on Linux, and the Windows desktop job
  # builds this crate only as a library *dependency*, whose `#[cfg(test)]` module
  # is never built. Three Windows-only defects reached `main` through that gap:
  # a stale 4-argument `acquire_cache_lease_sync` call that made `--lib` fail to
  # compile at all (#1520), a Job-retention test whose payload never spawned a
  # descendant so it asserted nothing (#1521), and two clippy findings in
  # `#[cfg(target_os = "windows")]` code that nothing had ever linted. The suite
  # is seconds long on both platforms; the coverage is the point.
  #
  # Plain `cargo test`, not nextest: several `process::tests` cases re-exec
  # named helper tests as child processes, and this is the invocation that was
  # validated against them.
  pg-embed-lib:
    name: vendored pg_embed unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    strategy:
      # Never let one platform's failure cancel the other: the whole reason
      # Windows is here is that the two legs cover disjoint code, so a red
      # Windows leg must not hide a Linux result (or vice versa).
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in git config while running
          # PR-controlled test code (build scripts execute).
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: pg-embed-local -> target

      # No GTK/webkit deps: this crate links neither, so unlike the desktop
      # jobs there is no apt step to stall on.
      - name: Library unit tests
        run: >-
          cargo test --locked --manifest-path pg-embed-local/Cargo.toml
          --lib --no-default-features --features rt_tokio

      # The workspace lint gate cannot reach this crate: `cargo fmt --all` and
      # `cargo clippy --workspace` both enumerate workspace members, and this one
      # is excluded. So until now NOTHING linted this tree — which is how a
      # `rust-version` that could not build (it declared 1.88 while the lease code
      # calls 1.89's `File::try_lock`) sat here unnoticed. `--all-targets` so the
      # test code is linted too.
      - name: cargo fmt --check
        run: cargo fmt --manifest-path pg-embed-local/Cargo.toml --all --check

      # `rt_tokio_migrate`, not the `rt_tokio` the test step uses. `--all-targets`
      # only builds targets whose `required-features` are satisfied, so under
      # `rt_tokio` the `database`, `migration` and `extension` test files were
      # silently not compiled — three of the six integration targets went
      # unlinted despite `--all-targets` implying otherwise. `rt_tokio_migrate`
      # is a strict superset (it enables `rt_tokio` plus sqlx), so this lints
      # every target and every line the narrower set did.
      - name: cargo clippy (-D warnings)
        run: >-
          cargo clippy --locked --manifest-path pg-embed-local/Cargo.toml
          --all-targets --no-default-features --features rt_tokio_migrate
          -- -D warnings

  # ── Vendored pg_embed integration tests (Linux only) ─────────────────────────
  # The six integration targets — auth, database, extension, lifecycle,
  # migration, common — each download a real PostgreSQL release and spawn a
  # cluster. Nothing ran them anywhere until now, and every defect found in
  # #1516 and #1517 was reachable only because of that:
  #
  #   * every test hardcoded port 5432, so they failed on any machine already
  #     running PostgreSQL — which is most of them;
  #   * the cache lease keyed self-contention on `ThreadId`, which misfires on
  #     recycled tokio `spawn_blocking` workers (`lifecycle::multiple_concurrent`);
  #   * `PgSettings::timeout` did not cover the spawn, so `server_timeout`
  #     asserted something that could not hold once the port was free;
  #   * `ensure_private_directory` re-granted owner-write on the published
  #     binary cache, so the cache never worked at all.
  #
  # Linux only, and that is not laziness. The rationale for excluding this crate
  # from the workspace (see the root Cargo.toml) is specifically that these
  # targets lose the startup CPU race on Windows and flake with
  # `PgTimedOutError`. That says nothing about Linux, where the same suite runs
  # clean. Keeping the gate on one platform is what makes it a gate rather than
  # a coin flip.
  #
  # Separate from `pg-embed-lib` on purpose: that job is a ~4 s lint-and-unit
  # gate and must stay fast enough to be the quick signal. This one is minutes.
  #
  # `rt_tokio_migrate` because `required-features` splits the targets — auth and
  # lifecycle need only `rt_tokio`, while database, extension and migration need
  # sqlx too. The migrate feature is a strict superset, so one invocation covers
  # all six.
  #
  # `--test-threads=1` matches the invocation these were verified under. The
  # `#[file_serial(pg_embed_cluster)]` keys already serialise cluster startup,
  # and cargo runs test binaries one at a time, so this only bounds concurrency
  # *within* a binary — which keeps two clusters off one runner's CPU.
  #
  # `--tests` also picks up the lib's unit tests, which `pg-embed-lib` already
  # runs. That overlap is a few seconds and is worth keeping: `pg-embed-lib`
  # runs them under `rt_tokio`, so this is the only place they are exercised
  # with sqlx in the graph.
  #
  # The `#[ignore]`d `acquire_twice_reuses_the_published_cache` stays ignored
  # here. It is only meaningful against a cold cache, and a step that silently
  # degrades to proving nothing once something else has warmed the cache is
  # worse than no step — that is exactly how its first draft passed against the
  # unfixed code. The suite's own wall-clock is the honest signal: if binary
  # acquisition regresses, this job's runtime jumps by ~35 s per test.
  #
  # Deliberately NOT caching `~/.cache/pg-embed`. Restoring the binary cache
  # between runs would skip the acquisition path entirely — the exact path whose
  # silent breakage (#1517) this suite is meant to catch. One download per run
  # is the cost of keeping the cold path honest.
  pg-embed-integration:
    name: vendored pg_embed integration tests (Linux)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in git config while running
          # PR-controlled test code (build scripts execute).
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: pg-embed-local -> target
          key: integration

      # `--nocapture` so the acquisition log is visible. Without it the harness
      # swallows output for passing tests, and the one property this job exists
      # to protect becomes unobservable: whether the binary cache is reused or
      # silently rebuilt per test. That breakage (#1517) shipped precisely
      # because nothing showed it. A warm run should emit exactly one
      # `verified pg executable cache unavailable ... rebuilding` line, from
      # `lifecycle::setup_download_failure_does_not_create_verified_cache`,
      # which points at an isolated empty cache on purpose — and its path is
      # under /tmp, not ~/.cache/pg-embed.
      #
      # Grep for `cache unavailable`, not `rebuilding`: the latter also matches
      # the test *name* `rebuilding_while_this_process_holds_the_cache_is_
      # reported_immediately` in the harness output, which is not a rebuild.
      - name: Integration tests
        run: >-
          cargo test --locked --manifest-path pg-embed-local/Cargo.toml
          --tests --no-default-features --features rt_tokio_migrate
          -- --test-threads=1 --nocapture

  # ── Vendored light-poseidon provenance (audit L-20) ──────────────────────────
  # Fails CI if `crates/light-poseidon` has drifted from the upstream pinned
  # SHA outside the documented arkworks-version edits. See
  # `crates/light-poseidon/PROVENANCE.md` for the re-vendor procedure.
  light-poseidon-provenance:
    name: light-poseidon provenance check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: scripts/check_light_poseidon_upstream.sh is PR-modifiable.
          persist-credentials: false
      - name: Verify vendored copy matches upstream pin
        run: bash scripts/check_light_poseidon_upstream.sh

  # ── light-poseidon seed reproducibility (L-20 companion) ─────────────────────
  # Proves `crates/light-poseidon/bn254_x5_seed.json` (a compact ~0.6 MB seed,
  # 4 little-endian u64 limbs per BN254 field element) reproduces the committed
  # ~1.5 MB parameter table that L-20 pins to upstream — for every Circom width
  # (t = 2..=13). Drives the test
  # `olympus_crypto::poseidon::tests::seed_reproduces_light_poseidon_parameters`.
  # Combined with the L-20 byte-for-byte check above, this transitively pins the
  # seed to upstream so a drifting seed fails CI before any proof uses it.
  light-poseidon-seed:
    name: light-poseidon seed reproduces params
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: `cargo nextest` builds and runs PR-controlled code.
          persist-credentials: false
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0
      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest
      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
      - name: Verify seed reproduces the committed Poseidon parameters
        run: cargo nextest run --locked --profile ci -p olympus-crypto --features poseidon seed_reproduces_light_poseidon_parameters

  # ── Vendored circomlib provenance ────────────────────────────────────────────
  # Fails CI if `proofs/vendor/circomlib/circuits/` has drifted from the
  # pinned upstream `iden3/circomlib` tag. See
  # `proofs/vendor/circomlib/PROVENANCE.md` for the re-vendor procedure.
  circomlib-provenance:
    name: circomlib provenance check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: scripts/check_circomlib_upstream.sh is PR-modifiable.
          persist-credentials: false
      - name: Verify vendored copy matches upstream pin
        run: bash scripts/check_circomlib_upstream.sh

  # ── Vendored Sigstore trust root provenance ──────────────────────────────────
  # Fails CI if `src-tauri/vendor/sigstore/trusted_root.json` is no longer the
  # target Sigstore's TUF metadata publishes. That file supplies the Rekor log
  # key `anchoring::rekor::verify_set` checks signed entry timestamps against,
  # so a silent rotation upstream would otherwise surface as receipts that stop
  # verifying, months later, with no signal here.
  #
  # `continue-on-error`: this job reaches a third-party CDN and, unlike the
  # circomlib pin, upstream can move without anyone touching this repository —
  # so a red run means "go re-vendor deliberately", not "this PR is broken".
  # Failing the merge would punish whoever's PR happened to be open when
  # Sigstore rotated. The step is still visible, and exit 3 (network) is
  # deliberately distinguished from exit 1 (drift) in the script.
  #
  # See `src-tauri/vendor/sigstore/PROVENANCE.md` for the rotation procedure,
  # including verifying TUF signatures out-of-band — which this check does not
  # do, because Olympus ships no TUF client.
  sigstore-trusted-root-provenance:
    name: sigstore trust root provenance check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: scripts/check_sigstore_trusted_root.sh is PR-modifiable.
          persist-credentials: false
      - name: Verify vendored trust root matches the published TUF target
        run: bash scripts/check_sigstore_trusted_root.sh

  # ── Formal circuit verification (circomspect static analysis) ────────────────
  # Source-level static analysis of every Circom circuit via Trail of Bits'
  # circomspect. Pure analysis — no circuit compilation, witness, or ceremony
  # artifact required, so it is fast and deterministic.
  #
  # GATING: circomspect.sh is strict by default and fails on any finding that is
  # not in proofs/circomspect_baseline.txt (the reviewed, accepted false-positive
  # set — see proofs/FORMAL_VERIFICATION.md). A *new* finding — including a new
  # instance of an already-accepted rule class at a new source line — blocks the
  # build. To accept a reviewed new finding, run
  # `bash proofs/circomspect.sh --update-baseline` and commit the diff.
  formal-circuit-verify:
    name: formal circuit verification (circomspect)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proofs == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: proofs/circomspect.sh is PR-modifiable.
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
          key: circomspect

      - name: Install circomspect
        run: cargo install circomspect --version 0.9.0 --locked

      - name: Run circomspect static analysis (gating, baseline-diffed)
        # Strict by default: fails on any finding not in
        # proofs/circomspect_baseline.txt. python3 (preinstalled on the runner)
        # powers the SARIF → signature baseline diff.
        run: bash proofs/circomspect.sh --ci --level WARNING

      # ── federation_quorum witness-level constraint tests ────────────────────
      # circomspect above is static analysis only; it cannot tell whether an
      # adversarial witness is actually rejected. These tests compile the
      # circuit and drive `snarkjs wtns calculate` over committed fixtures,
      # asserting each adversarial input aborts on its NAMED constraint
      # (audit OLY-M5 / OLY-L12 / threshold range). No ptau or zkey needed, so
      # this runs years before the trusted-setup ceremony.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: proofs/package-lock.json

      - name: Install proof-tooling dependencies
        run: npm ci --ignore-scripts --prefix proofs

      - name: Install circom
        # Same cargo-install posture as circomspect above, pinned to the
        # immutable commit behind tag v2.2.3 (tags can move; revs cannot) —
        # the version the constraint counts in
        # docs/federation-quorum-credentials.md were measured with.
        # --version satisfies the privileged-action pin gate and makes cargo
        # cross-check the crate version at that rev.
        run: >-
          cargo install --git https://github.com/iden3/circom
          --rev ad44e915a12bb047b05745c2884aad9cc8326bc6
          --version 2.2.3 --locked circom

      - name: Compile federation_quorum
        working-directory: proofs
        run: circom circuits/federation_quorum.circom --r1cs --wasm --sym -l circuits -l node_modules -o build

      - name: Run federation_quorum witness constraint tests
        env:
          # Turns a missing prerequisite into a failure instead of a silent
          # skip — this is the one job that guarantees they can run.
          OLYMPUS_REQUIRE_CIRCUIT_TESTS: "1"
        run: node --test proofs/test/federation_quorum.test.js

      - name: Upload circomspect results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circomspect-results
          path: |
            proofs/build/circomspect_results.json
            proofs/build/circomspect/
          if-no-files-found: ignore

  # ── Vendored glib-0.18.5-patched provenance (audit M-SC-1) ───────────────────
  # Fails CI if `crates/glib-0.18.5-patched/` has drifted from the published
  # `glib-0.18.5` crate beyond the documented GHSA-wrw7-89jp-8q8g backport.
  # This ~52k-LoC tree links into every Linux build; the other two vendored
  # trees (light-poseidon, circomlib) already have this gate. See
  # `crates/glib-0.18.5-patched/PROVENANCE.md` for the re-vendor procedure.
  glib-provenance:
    name: glib provenance check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: scripts/check_glib_upstream.sh is PR-modifiable.
          persist-credentials: false
      - name: Verify vendored copy matches published crate
        run: bash scripts/check_glib_upstream.sh

  # ── Rust verifier fuzz ───────────────────────────────────────────────────────
  cargo-fuzz-verifier:
    name: Cargo fuzz Olympus verifier (30 s per target)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-verifier == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: `cargo fuzz` builds and runs PR-controlled code.
          persist-credentials: false

      - name: Install Rust nightly
        run: rustup toolchain install nightly-2026-07-20 --no-self-update

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: verifiers/rust -> target
          key: nightly

      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-20 install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz verify_merkle_proof (30 s)
        working-directory: verifiers/rust
        run: cargo +nightly-2026-07-20 fuzz run fuzz_verify_merkle_proof -- -max_total_time=30

      - name: Fuzz compute_merkle_root (30 s)
        working-directory: verifiers/rust
        run: cargo +nightly-2026-07-20 fuzz run fuzz_compute_merkle_root -- -max_total_time=30

      - name: Fuzz ADR-0030 redaction bundle verifier (30 s)
        working-directory: verifiers/rust
        run: cargo +nightly-2026-07-20 fuzz run fuzz_redaction_bundle -- -max_total_time=30

      # Nothing linted the verifier fuzz harness either: it is its own Cargo root, so the
      # workspace fmt/clippy gates never reached it. Nightly is needed to
      # *run* a fuzzer (sanitizer flags), not to lint one — these use the
      # repo-pinned stable toolchain like every other lint gate.
      - name: Check fuzz harness formatting
        run: cargo fmt --manifest-path verifiers/rust/fuzz/Cargo.toml --all --check

      - name: Lint fuzz harness
        run: cargo clippy --locked --manifest-path verifiers/rust/fuzz/Cargo.toml --all-targets -- -D warnings

  # ── Canonical Rust crypto fuzz targets ──────────────────────────────────────
  # The root fuzz workspace is separate from verifiers/rust/fuzz. Keep both
  # suites wired: these targets exercise olympus-crypto itself.
  cargo-fuzz-crypto:
    name: Cargo fuzz canonical crypto (30 s per target)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.crypto-fuzz == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: rustup toolchain install nightly-2026-07-20 --no-self-update

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz -> fuzz/target
          key: nightly-root-fuzz

      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-20 install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz crypto primitives (30 s)
        working-directory: fuzz
        run: cargo +nightly-2026-07-20 fuzz run fuzz_crypto_primitives -- -max_total_time=30

      - name: Fuzz sparse Merkle tree (30 s)
        working-directory: fuzz
        run: cargo +nightly-2026-07-20 fuzz run fuzz_smt -- -max_total_time=30

      # Nothing linted the canonical-crypto fuzz harness either: it is its own Cargo root, so the
      # workspace fmt/clippy gates never reached it. Nightly is needed to
      # *run* a fuzzer (sanitizer flags), not to lint one — these use the
      # repo-pinned stable toolchain like every other lint gate.
      - name: Check fuzz harness formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml --all --check

      - name: Lint fuzz harness
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings

  # ── Supply-chain audit (Rust + Node) ────────────────────────────────────────
  supply-chain:
    name: supply-chain (sbom + audit)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: cargo/npx resolution executes PR-controlled build scripts.
          persist-credentials: false

      - name: Install Rust stable
        run: rustup toolchain install stable --no-self-update && rustup default stable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      # pnpm is the source-of-truth package manager for the app/public-ui
      # workspace; `pnpm audit` (below) reads pnpm-lock.yaml + the
      # auditConfig.ignoreGhsas suppressions in pnpm-workspace.yaml. Audit
      # only needs the lockfile, so no `pnpm install` step is required.
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.21

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked

      # `cargo audit` reads a lockfile without checking it still satisfies its
      # manifest. verifiers/rust/fuzz/Cargo.lock had drifted ~1000 lines out of
      # date, so the audit was passing on a dependency set that job never built
      # (its `cargo fuzz run` resolves fresh, with no --locked). Assert currency
      # first, so a stale lock fails loudly instead of being silently audited.
      - name: Verify every tracked lockfile is current
        run: |
          set -euo pipefail
          while IFS= read -r lock; do
            echo "::group::cargo metadata --locked ${lock}"
            cargo metadata --manifest-path "$(dirname "${lock}")/Cargo.toml" \
              --locked --format-version 1 >/dev/null
            echo "::endgroup::"
          done < <(git ls-files '*Cargo.lock')

      - name: Rust dependency vulnerability audit
        run: |
          IGNORE_ARGS=$(grep -v '^[[:space:]]*#' cargo-audit-baseline.txt | awk 'NF {printf "--ignore %s ", $1}')
          # Audit M-SC-2: audit EVERY tracked lockfile, not just the workspace
          # + verifier roots. The fuzz-harness lockfiles (fuzz/,
          # verifiers/rust/fuzz/) are dev-only and not shipped, but the `deps`
          # change-filter already triggers this job on any `**/Cargo.lock`
          # edit — so audit what we trigger on.
          #
          # A lockfile may additionally carry a `cargo-audit-ignore.txt`
          # alongside it, whose entries apply to that lockfile ONLY. Needed
          # because build targets do not share a toolchain floor: the RISC Zero
          # canonicalization guest builds on `rustc 1.88.0-dev` and so cannot
          # take a fix that requires 1.90, while the shipped desktop graph can
          # and did. Without scoping, clearing such an advisory anywhere would
          # mean silencing it everywhere — the opposite of what the fix earned.
          while IFS= read -r lock; do
            SCOPED_ARGS=""
            scoped_file="$(dirname "${lock}")/cargo-audit-ignore.txt"
            if [ -f "${scoped_file}" ]; then
              SCOPED_ARGS=$(grep -v '^[[:space:]]*#' "${scoped_file}" | awk 'NF {printf "--ignore %s ", $1}')
              echo "note: ${lock} carries scoped ignores: ${SCOPED_ARGS}"
            fi
            echo "::group::cargo audit ${lock}"
            cargo audit --file "${lock}" ${IGNORE_ARGS} ${SCOPED_ARGS}
            echo "::endgroup::"
          done < <(git ls-files '*Cargo.lock')

      - name: Node.js dependency vulnerability audit
        run: |
          npm audit --prefix verifiers/javascript --audit-level=high
          # app/public-ui is a pnpm workspace member — audit the real
          # pnpm-lock.yaml (honoring auditConfig.ignoreGhsas in
          # pnpm-workspace.yaml) instead of a stale npm package-lock.json
          # shadow that periodically drifts (audit L-SC-5). pnpm audit has no
          # working per-package --filter, so run it from the package dir.
          (cd app/public-ui && pnpm audit --audit-level high)
          # proofs is a pnpm member too, but it is NOT the same npm-shadow class
          # as app/public-ui, and this line is not a pending migration. Both
          # halves below are load-bearing; changing either breaks something.
          #
          #   * `proofs/package-lock.json` cannot be deleted. setup_circuits.sh
          #     hashes it directly (`sha256sum package-lock.json`) to decide
          #     whether node_modules is current, and compiles circuits with
          #     `circom -l node_modules`, resolving circomlib templates from a
          #     flat layout. Its own comment warns that a mismatched
          #     node_modules "can silently produce different R1CS/WASM/zkey
          #     artifacts" — a wrong move here is a bad ceremony, not a red CI.
          #
          #   * `--audit-level=critical` cannot be raised to `high` as-is.
          #     GHSA advisories on `ejs` (and its `jake` dependency) reach us
          #     through `snarkjs`, which reports 6 high findings at that level.
          #     Blast radius: build-time only — snarkjs generates proving keys
          #     during the ceremony and ships in no binary or bundle. Unblock
          #     condition: a snarkjs release depending on ejs >= 3.1.10.
          #     npm audit has no ignore mechanism (there is no npm equivalent of
          #     pnpm auditConfig.ignoreGhsas), so the severity floor is the only
          #     lever available until then.
          npm audit --prefix proofs --audit-level=critical
          # tools/wiserepo is a standalone npm package (NOT a pnpm workspace
          # member — pnpm-workspace.yaml lists only app/public-ui and proofs),
          # so neither the pnpm audit above nor a root install reaches it. It
          # is dev tooling that never ships in a binary or bundle, but it does
          # run on developer machines with an API key in the environment and
          # in the pre-commit path, so it gets the same `high` floor as the
          # other first-party JS.
          npm audit --prefix tools/wiserepo --audit-level=high

      # ── License + source policy (deny.toml) ──────────────────────────────────
      # Machine-enforced version of THIRD_PARTY_LICENSES.md. Catches a new
      # dep with an unexpected license (GPL slipping into the Cargo graph,
      # an unknown registry, a wildcard version) before it ships.
      - name: Cache cargo-deny binary
        id: cache-cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          # Cache key MUST match the --version pin below — same pin invariant
          # as cargo-cyclonedx / cargo-mutants. Bump deliberately.
          key: cargo-deny-0.16.4

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.16.4

      # `bans licenses sources` only — NOT `advisories`. Vulnerability /
      # advisory scanning is already done by `cargo audit` above; running it
      # again here is redundant, and cargo-deny 0.16.4's bundled rustsec
      # parser chokes on newer advisory-DB entries (e.g. RUSTSEC-2026-0035),
      # which is a tool-vs-DB version skew, not a real finding. Keep
      # cargo-deny focused on the policy it owns: licenses, bans, sources.
      - name: cargo deny check (workspace)
        run: cargo deny --all-features check bans licenses sources

      - name: cargo deny check (verifiers/rust)
        run: cargo deny --all-features --manifest-path verifiers/rust/Cargo.toml check bans licenses sources

      # The standalone CLI is outside the root workspace. Its two public path
      # dependencies intentionally omit versions, so the root wildcard-path
      # policy cannot be applied verbatim; license and source policy still can.
      - name: cargo deny check (clients/cli licenses + sources)
        run: cargo deny --all-features --manifest-path clients/cli/Cargo.toml check licenses sources

      # `cargo audit` covers every tracked lockfile (M-SC-2), but the license /
      # ban / source policy did not — it reached 3 of the 8 Cargo trees. The
      # zkVM trees matter most: the guest's dependencies compile into
      # `proofs/zkvm/canonicalization/olympus_canonicalization_guest.elf`, a
      # committed artifact on the court-evidence verification path, so
      # deny.toml's "no GPL in the Cargo dep graph" claim should actually be
      # enforced there. Both pass today; this keeps them that way.
      - name: cargo deny check (zkVM guest)
        run: cargo deny --all-features --manifest-path proofs/zkvm/canonicalization/guest/Cargo.toml check bans licenses sources

      - name: cargo deny check (zkVM host-tools)
        run: cargo deny --all-features --manifest-path proofs/zkvm/canonicalization/host-tools/Cargo.toml check bans licenses sources

      # The fuzz harnesses are their own Cargo roots too. They needed a policy
      # change to gate at all: `libfuzzer-sys` is "(MIT OR Apache-2.0) AND
      # NCSA", and NCSA was not in the allow-list because these trees had never
      # been checked. It is dev-only (absent from the shipped workspace lock),
      # so it is allowed narrowly rather than the trees being left ungated.
      - name: cargo deny check (fuzz harness)
        run: cargo deny --all-features --manifest-path fuzz/Cargo.toml check bans licenses sources

      - name: cargo deny check (verifier fuzz harness)
        run: cargo deny --all-features --manifest-path verifiers/rust/fuzz/Cargo.toml check bans licenses sources

      - name: Cache cargo-vet binary
        id: cache-cargo-vet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-vet
          key: cargo-vet-0.10.2

      - name: Install cargo-vet
        if: steps.cache-cargo-vet.outputs.cache-hit != 'true'
        run: cargo install cargo-vet --locked --version 0.10.2

      - name: cargo vet check (runtime workspace)
        run: cargo vet --locked

      # ── SBOM generation (audit M-4) ──────────────────────────────────────────
      # SECURITY.md / threat-model.md claim SBOMs are produced; this is where
      # that claim actually becomes true. We emit CycloneDX SBOMs for every
      # consumer-facing artifact (Rust workspace, Rust verifier, JS frontend,
      # JS verifier, proofs ceremony tooling) and upload them as a single
      # workflow artifact. Release tooling can pull from the same run.
      - name: Cache cargo-cyclonedx binary
        id: cache-cyclonedx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          # Cache key MUST match CARGO_CYCLONEDX_VERSION below — same
          # pin invariant as cargo-mutants in mutation-testing.yml.
          key: cargo-cyclonedx-0.5.9

      - name: Install cargo-cyclonedx
        if: steps.cache-cyclonedx.outputs.cache-hit != 'true'
        # Pin to the version implied by the cache key; unpinned
        # `cargo install` could store a newer release under a key that
        # claims a specific version, drifting silently across runs.
        # Bump deliberately when reviewing a newer cargo-cyclonedx
        # changelog.
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate Rust SBOMs (CycloneDX)
        run: |
          mkdir -p sbom
          # cargo-cyclonedx writes `<crate-name>.cdx.json` next to each
          # crate's Cargo.toml. `--override-filename` accepts only a
          # basename (no path separators) so we let the tool use the
          # natural per-crate names and gather the files afterwards.
          # Workspace pass — one SBOM per member crate.
          cargo cyclonedx --format json --all
          # verifiers/rust is workspace-excluded, generate separately.
          (cd verifiers/rust && cargo cyclonedx --format json)
          # Move every produced .cdx.json into sbom/. Restrict to the
          # known crate dirs so nothing under target/ leaks in. Use
          # `mv -n` (no-clobber) and explicitly fail the job if the
          # destination already exists — workspace crate names are
          # unique by Cargo enforcement so this is unreachable today,
          # but a silent overwrite would drop one crate's SBOM if a
          # future refactor ever broke that invariant. Better to surface
          # the collision loudly than ship an incomplete SBOM artifact.
          while IFS= read -r src; do
            dst="sbom/$(basename "$src")"
            if [ -e "$dst" ]; then
              echo "::error::SBOM filename collision at $dst (sources include $src)" >&2
              exit 1
            fi
            mv -n "$src" "$dst"
          done < <(find src-tauri crates pg-embed-local verifiers/rust \
                     -maxdepth 2 -name '*.cdx.json')

      - name: Generate Node SBOMs (CycloneDX)
        env:
          # Pin to a known-good release rather than `@latest` so an upstream
          # bump can't silently change SBOM output between CI runs. Bump
          # deliberately when reviewing a newer CycloneDX-npm changelog.
          CYCLONEDX_NPM_VERSION: "4.2.1"
        run: |
          mkdir -p sbom
          # public-ui is built from the workspace pnpm-lock.yaml, so generate
          # its SBOM with pnpm from that same graph. Creating an npm lockfile
          # here would describe a fresh npm resolution rather than the bytes CI
          # and the release workflow actually build.
          pnpm --dir app/public-ui sbom \
            --sbom-format cyclonedx \
            --lockfile-only > sbom/public-ui.cdx.json
          test -s sbom/public-ui.cdx.json
          jq -e '
            .bomFormat == "CycloneDX" and
            .metadata.component.name == "public-ui" and
            any(.metadata.tools.components[]?; .name == "pnpm") and
            (.components | length > 0)
          ' sbom/public-ui.cdx.json >/dev/null

          # The standalone verifier and proof tooling still use committed npm
          # package-lock files, so cyclonedx-npm remains correct for them.
          for pair in "verifiers/javascript:verifier-javascript" \
                      "proofs:proofs-tooling"; do
            prefix="${pair%:*}"
            name="${pair#*:}"
            npx --yes "@cyclonedx/cyclonedx-npm@${CYCLONEDX_NPM_VERSION}" \
              --output-format JSON \
              --output-file "sbom/${name}.cdx.json" \
              --package-lock-only \
              --ignore-npm-errors \
              "$prefix/package.json"
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/
          retention-days: 90
          if-no-files-found: error

  # ── Tauri desktop unit tests ─────────────────────────────────────────────────
  tauri-unit:
    name: tauri desktop unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: `cargo nextest`/`cargo test` build and run PR-controlled code.
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      # The embedded harness downloads a full PostgreSQL release from Maven
      # Central. Four jobs need it, and enough parallel runs get throttled:
      # #1523 lost its prover job to
      # "HTTP 429 Too Many Requests fetching PostgreSQL 15.16.0".
      #
      # This is not a trust shortcut. pg_embed verifies every acquisition
      # against the SHA-256 digests pinned in `pg-embed-local/src/pg_fetch.rs`
      # and refuses a tree whose retained marker does not match, so a poisoned
      # or truncated cache fails closed exactly as a poisoned download does.
      #
      # Keyed on that same file, which holds both `PG_V15` and those digests, so
      # changing either invalidates the cache rather than serving stale bytes.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\pg-embed' || '~/.cache/pg-embed' }}
          key: pg-embed-bin-${{ runner.os }}-${{ hashFiles('pg-embed-local/src/pg_fetch.rs') }}

      - name: Install Linux system dependencies
        # Hardened against the apt hang that ate the full 6 h job budget on PR
        # #1058 (an Ubuntu mirror dropped a connection mid-fetch and apt blocked
        # forever waiting for the rest). Three lines of defense:
        #   1. step-level `timeout-minutes` caps the whole step at 50 min so a
        #      stuck apt can never consume the job's 6 h budget;
        #   2. `timeout N apt-get …` caps each individual apt invocation so a
        #      mirror-level stall surfaces as a non-zero exit, not a hang;
        #   3. retry loops on BOTH `apt-get update` and `apt-get install`
        #      (3 attempts each) absorb transient mirror flakes without
        #      re-running the whole job. `install` needs it as much as
        #      `update`: a slow mirror mid-`libwebkit2gtk` (25 MB) trips the
        #      per-call `timeout` and used to fail the job outright (exit 124).
        # DEBIAN_FRONTEND=noninteractive + APT_LISTCHANGES_FRONTEND=none make
        # sure no postinst can ever pop a prompt (which would also hang).
        #
        # BUDGET INVARIANT — defense 1 must exceed what defenses 2+3 can spend,
        # or it silently cancels them and the documented three attempts can
        # never all run. Note the recovery tail (`dpkg`/`sleep`) runs after
        # EVERY failed attempt including the third, so it is 3×, not 2×. Every
        # term must be finite for this sum to bound anything — hence `dpkg
        # --configure -a` is wrapped in `timeout` like the apt calls, even
        # though it is `|| true`. Worst case:
        #     update   3 × 240 s  +  3 × 5 s sleep                =   735 s
        #     install  3 × 600 s  +  3 × 120 s dpkg  +  3 × 10 s  =  2190 s
        #                                              total ≈  2925 s  (49 min)
        # so the cap is 50 min. Keep every copy of this step in this file in
        # step: raising a per-call `timeout` or an attempt count without
        # raising the cap re-introduces the bug it is there to prevent.
        timeout-minutes: 50
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          for i in 1 2 3; do
            if sudo -E timeout 600 apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              mold; then
              break
            fi
            echo "apt-get install attempt $i failed; recovering and sleeping 10 s"
            sudo -E timeout 120 dpkg --configure -a || true
            sleep 10
            if [ "$i" = "3" ]; then
              echo "apt-get install failed 3 times — aborting"
              exit 1
            fi
          done

      - name: Set up Node.js (for ceremony npm tooling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: ZK ceremony artifacts (cached)
        uses: ./.github/actions/zk-ceremony-artifacts

      # `src-tauri` is only one workspace member. Run the library suites
      # explicitly so olympus-manifest, olympus-crypto, light-poseidon, and
      # babyjubjub-permissive are merge-gating rather than coverage-only.
      - name: cargo nextest (non-desktop workspace libraries)
        run: cargo nextest run --locked --profile ci --workspace --exclude olympus-desktop --all-features

      - name: Regenerate and compare cross-language golden vectors
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p olympus-crypto --example gen_ssmf_vectors --features smt > generated-ssmf.json
          jq -e --slurpfile generated generated-ssmf.json '
            .ssmf_existence_proof == $generated[0].ssmf_existence_proof and
            .ssmf_nonexistence_proof == $generated[0].ssmf_nonexistence_proof
          ' verifiers/test_vectors/vectors.json >/dev/null

          cargo run --locked -p olympus-crypto --example gen_redaction_vectors --features redaction
          cargo run --locked -p olympus-desktop --no-default-features --example gen_checkpoint_quorum_vectors
          cargo run --locked -p olympus-desktop --no-default-features --example gen_sbt_quorum_vectors
          cargo run --locked -p babyjubjub-permissive --example gen_rust_eddsa_vectors
          git diff --exit-code -- \
            verifiers/test_vectors/redaction_vectors.json \
            verifiers/test_vectors/checkpoint_quorum_vectors.json \
            verifiers/test_vectors/sbt_quorum_vectors.json \
            verifiers/javascript/rust_eddsa_vectors.json

      # `--tests` runs both lib unit tests AND integration tests in
      # src-tauri/tests/. The embedded-Postgres binaries are excluded here and
      # run once-per-binary by cargo test below. Nextest's process-per-test model
      # would otherwise defeat their shared static harness and leak one pg_embed
      # cluster per test until initdb exhausts the runner.
      #
      # This common job runs the LEAN build
      # (`--no-default-features`): with `prover` off, `ark-circom` and its
      # wasmer/cranelift stack are not compiled, which is the bulk of this
      # job's wall-clock. The Groth16 prove/verify roundtrips live in the
      # separate `tauri-prover-tests` job below (the `zk_prove_*` targets
      # declare `required-features = ["prover", "zk-test-utils"]`, so they are
      # simply skipped here).
      - name: cargo nextest (olympus-desktop, lean / no prover, non-DB)
        working-directory: src-tauri
        env:
          # CI build-speed only — NOT a behavior change. `mold` slashes the
          # link of the fat per-test-file binaries; `line-tables-only`
          # debuginfo cuts codegen + link size while keeping file:line in
          # panic backtraces.
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: |
          source ../scripts/embedded-postgres-tests.sh
          cargo nextest run --locked --profile ci --no-default-features --tests \
            -E "$EMBEDDED_POSTGRES_NEXTEST_FILTER"

      - name: cargo test (embedded PostgreSQL integration binaries)
        working-directory: src-tauri
        timeout-minutes: 20
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: |
          source ../scripts/embedded-postgres-tests.sh
          cargo test --locked --no-default-features \
            "${EMBEDDED_POSTGRES_CARGO_TEST_ARGS[@]}" \
            -- --test-threads=1

      - name: cargo nextest (opt-in segmenter + dev-route features)
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: >-
          cargo nextest run --locked --profile ci --no-default-features
          --features textrun-segmenter,dev-signing-route --lib

      - name: cargo test doctests (workspace)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: cargo test --locked --doc --workspace

  # ── Tauri ZK prover tests (heavy: ark-circom/wasmer) ─────────────────────────
  # Split out from `tauri-unit` so the common test path doesn't pay the
  # wasmer/cranelift compile. Runs the full Groth16 prove/verify roundtrips
  # under `--features prover,zk-test-utils` (the `zk_prove_*` integration
  # targets require both). Same system deps + ceremony artifacts as tauri-unit.
  tauri-prover-tests:
    name: tauri ZK prover tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: `cargo nextest` builds and runs PR-controlled code.
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
          key: prover

      # The embedded harness downloads a full PostgreSQL release from Maven
      # Central. Four jobs need it, and enough parallel runs get throttled:
      # #1523 lost its prover job to
      # "HTTP 429 Too Many Requests fetching PostgreSQL 15.16.0".
      #
      # This is not a trust shortcut. pg_embed verifies every acquisition
      # against the SHA-256 digests pinned in `pg-embed-local/src/pg_fetch.rs`
      # and refuses a tree whose retained marker does not match, so a poisoned
      # or truncated cache fails closed exactly as a poisoned download does.
      #
      # Keyed on that same file, which holds both `PG_V15` and those digests, so
      # changing either invalidates the cache rather than serving stale bytes.
      - name: Cache embedded PostgreSQL binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\pg-embed' || '~/.cache/pg-embed' }}
          key: pg-embed-bin-${{ runner.os }}-${{ hashFiles('pg-embed-local/src/pg_fetch.rs') }}

      - name: Install Linux system dependencies
        timeout-minutes: 50
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          for i in 1 2 3; do
            if sudo -E timeout 600 apt-get install -y \
              libwebkit2gtk-4.1-dev \
              libappindicator3-dev \
              librsvg2-dev \
              patchelf \
              mold; then
              break
            fi
            echo "apt-get install attempt $i failed; recovering and sleeping 10 s"
            sudo -E timeout 120 dpkg --configure -a || true
            sleep 10
            if [ "$i" = "3" ]; then
              echo "apt-get install failed 3 times — aborting"
              exit 1
            fi
          done

      - name: Set up Node.js (for ceremony npm tooling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: ZK ceremony artifacts (cached)
        uses: ./.github/actions/zk-ceremony-artifacts

      # `zk-test-utils` exposes the audit-M-5 escape hatches on
      # `CircomProvingKey` needed by `tests/zk_prove_existence.rs`'s #1011
      # side-by-side parity diagnostic; `prover` compiles the in-process
      # Groth16 prover. Together they enable the full prove/verify roundtrip.
      # The embedded-Postgres harness binaries stay in: they cover `/zk/prove`,
      # which only exists under `prover`. Only the exclusive binary is filtered
      # out — see scripts/embedded-postgres-tests.sh for why it cannot share a
      # parallel run, and the serial job in `tauri desktop unit tests` for
      # where it does run.
      - name: cargo nextest (olympus-desktop, prover + zk-test-utils)
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: |
          source ../scripts/embedded-postgres-tests.sh
          cargo nextest run --locked --profile ci --features prover,zk-test-utils --tests \
            -E "$EXCLUSIVE_POSTGRES_NEXTEST_FILTER"

      # The quorum circuit is next-phase and is not part of the default desktop
      # feature set. Compile and run its gated unit tests explicitly so the
      # fourth generated circuit and Rust witness/prove/verify paths cannot rot.
      - name: cargo nextest (quorum-circuit feature)
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: >-
          cargo nextest run --locked --profile ci
          --no-default-features --features prover,quorum-circuit --lib

  # ── Frontend type-check + Vite production build ──────────────────────────────
  frontend-build:
    name: frontend type-check + build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No job token in git config while this job runs PR-controlled
          # code: `pnpm install` executes PR-controlled lifecycle scripts.
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "11.1.2"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend unit tests
        working-directory: app/public-ui
        run: pnpm test:run

      - name: TypeScript type-check
        working-directory: app/public-ui
        run: pnpm exec tsc --noEmit

      - name: ESLint
        # Same gate the .githooks/pre-push hook runs locally — without this
        # step the eslint config (react-hooks rules etc.) is never enforced
        # for contributors who haven't opted into the hooks.
        working-directory: app/public-ui
        run: pnpm exec eslint . --max-warnings 0

      - name: Vite production build
        working-directory: app/public-ui
        run: pnpm build

  # ── Secret scanning ───────────────────────────────────────────────────────
  # Runs on every push/PR regardless of what changed -- a leaked credential
  # can land in any file type, so this deliberately isn't gated behind the
  # `changes` filter the way the language-specific jobs are.
  #
  # .gitleaks-baseline.json pins the known-noise findings already triaged in
  # this repo (BLAKE3/Poseidon test-vector constants, CI tool-version pins
  # misread as high-entropy strings, docs placeholders like db.example.com).
  # Only a finding NOT already in the baseline fails the build.
  #
  # To accept new noise (e.g. a new hash constant lands and gitleaks flags
  # it): regenerate the baseline locally with the same pinned version --
  #   gitleaks detect --source . --report-format json \
  #     --report-path .gitleaks-baseline.json
  # -- review the diff, and commit it. Do not regenerate the baseline to make
  # a real finding disappear; fix the finding instead.
  secrets-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run gitleaks against baseline
        run: |
          gitleaks detect --source . \
            --baseline-path .gitleaks-baseline.json \
            --redact -v
