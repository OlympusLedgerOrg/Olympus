name: Olympus CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect which areas of the repo changed ───────────────────────────────────
  # Every other job below conditions on these outputs so PRs only run the
  # checks they could plausibly break. Pure docs PRs skip everything heavy.
  # The "ci" filter forces all jobs to run whenever the workflow itself
  # changes, so workflow edits get full coverage.
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust-app: ${{ steps.filter.outputs.rust-app }}
      rust-verifier: ${{ steps.filter.outputs.rust-verifier }}
      rust-cli: ${{ steps.filter.outputs.rust-cli }}
      python-client: ${{ steps.filter.outputs.python-client }}
      crypto-fuzz: ${{ steps.filter.outputs.crypto-fuzz }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deps: ${{ steps.filter.outputs.deps }}
      proofs: ${{ steps.filter.outputs.proofs }}
      proofs-js: ${{ steps.filter.outputs.proofs-js }}
      js-verifier: ${{ steps.filter.outputs.js-verifier }}
      docs: ${{ steps.filter.outputs.docs }}
      tooling: ${{ steps.filter.outputs.tooling }}
      # A manual dispatch is an explicit request for the complete suite, even
      # when the most recent commit touched only docs.
      ci: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            rust-app:
              - 'src-tauri/**'
              - 'crates/**'
              - 'pg-embed-local/**'
              - 'migrations/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - '.config/nextest.toml'
              - 'clippy.toml'
              - 'proofs/keys/**'
              - 'proofs/vendor/**'
              - 'proofs/circuits/**'
              - 'proofs/setup_circuits.sh'
              - 'proofs/package.json'
              - 'proofs/package-lock.json'
              - 'fuzz/**'
              - 'verifiers/test_vectors/**'
              - 'verifiers/javascript/rust_eddsa_vectors.json'
              - 'app/public-ui/src/lib/redactionGeometry.vectors.json'
              - '.github/actions/**'
              # Dev tooling that runs against the Rust build — broken hooks
              # or wrappers should fail CI before contributors hit them.
              - '.githooks/**'
              - 'scripts/**'
            rust-verifier:
              - 'verifiers/rust/**'
              - 'verifiers/test_vectors/**'
            rust-cli:
              - 'clients/cli/**'
              - 'crates/olympus-manifest/**'
              - 'crates/olympus-crypto/**'
            python-client:
              - 'clients/python/**'
              - 'crates/olympus-manifest/**'
              - 'crates/olympus-crypto/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            crypto-fuzz:
              - 'fuzz/**'
              - 'crates/olympus-crypto/**'
              - 'crates/light-poseidon/**'
              - 'crates/babyjubjub-permissive/**'
            docs:
              - 'docs/adr/**'
              - 'scripts/check_adr_index.mjs'
            tooling:
              - '.license-header-baseline'
              - '.prettierignore'
              - '.prettierrc.json'
              - 'taplo.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/check-license-headers.mjs'
              - '**/*.circom'
              - '**/*.cjs'
              - '**/*.css'
              - '**/*.js'
              - '**/*.json'
              - '**/*.mjs'
              - '**/*.ps1'
              - '**/*.py'
              - '**/*.rs'
              - '**/*.sh'
              - '**/*.sql'
              - '**/*.toml'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.yaml'
              - '**/*.yml'
            frontend:
              - 'app/public-ui/**'
              - '.pnpmfile.cjs'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
            deps:
              - '.github/dependabot.yml'
              - '.pnpmfile.cjs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/package.json'
              - '**/package-lock.json'
              - '**/pnpm-lock.yaml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'cargo-audit-baseline.txt'
              - 'deny.toml'
              - 'supply-chain/**'
            proofs:
              - 'proofs/circuits/**'
              - 'proofs/vendor/**'
              - 'proofs/circomspect.sh'
              - 'proofs/circomspect_baseline.txt'
              - 'proofs/formal_verify.sh'
            proofs-js:
              - 'proofs/package.json'
              - 'proofs/package-lock.json'
              - 'proofs/safe-jsonpath/**'
              - 'proofs/test/**'
              - 'proofs/test_inputs/**/*.js'
              - 'proofs/*.js'
            js-verifier:
              - 'verifiers/javascript/**'
              # The JS conformance suite loads verifiers/test_vectors/vectors.json,
              # so a vectors-only change must re-run it (parity with rust-verifier).
              - 'verifiers/test_vectors/**'
            ci:
              - '.github/actions/**'
              - '.github/workflows/**'

  # ── ADR documentation drift gate ─────────────────────────────────────────────
  docs-adr:
    name: ADR index check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check ADR index/status drift
        run: node scripts/check_adr_index.mjs

  # ── Formatting + per-file license headers ───────────────────────────────────
  repo-tooling:
    name: formatting + license headers
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tooling == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "11.1.2"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run formatting and license-header checks
        run: pnpm tooling:check

  # ── Rust reference verifier ──────────────────────────────────────────────────
  rust-verifier:
    name: Rust verifier conformance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-verifier == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        run: rustup toolchain install stable --no-self-update && rustup default stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: verifiers/rust -> target

      - name: Run Rust verifier tests
        working-directory: verifiers/rust
        run: cargo nextest run --locked

      - name: Run Rust verifier doctests
        working-directory: verifiers/rust
        run: cargo test --locked --doc

  # ── JavaScript reference verifier ────────────────────────────────────────────
  # Parity with the Rust verifier conformance job above. Without this the JS
  # verifier's crypto deps (@noble/curves, @noble/hashes, circomlibjs,
  # blake3-wasm) are only SBOM'd / npm-audited, never actually exercised — so a
  # Dependabot bump that breaks them at runtime can pass green (e.g. a
  # @noble/curves major that drops a subpath export). Run its full conformance
  # suite (canonical-JSON 780-vector parity, BJJ vectors, checkpoint verify).
  js-verifier:
    name: JS verifier conformance
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.js-verifier == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in git config while running PR-controlled
          # `npm ci`/`npm test`. Matches macos-ci.yml.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"

      - name: Install + run JS verifier conformance tests
        working-directory: verifiers/javascript
        run: |
          npm ci
          npm test

  # ── Standalone Rust client CLI ──────────────────────────────────────────────
  # clients/cli is its own Cargo workspace, so none of the root --workspace
  # commands discover its unit or integration targets.
  rust-cli:
    name: Rust client CLI tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-cli == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: clients/cli -> clients/cli/target

      - name: Run CLI unit + integration tests
        run: cargo nextest run --locked --manifest-path clients/cli/Cargo.toml --all-features

      - name: Check CLI formatting
        run: cargo fmt --manifest-path clients/cli/Cargo.toml --all --check

      - name: Lint CLI targets
        run: cargo clippy --locked --manifest-path clients/cli/Cargo.toml --all-targets --all-features -- -D warnings

  # ── Python verifier/client SDK ──────────────────────────────────────────────
  # This is a verify-only cross-language client, not a Python service. Test the
  # declared lower Python bound and the current stable line, and keep its
  # committed parity vectors tied to the Rust source of truth.
  python-client:
    name: Python client tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python-client == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: clients/python/pyproject.toml

      - name: Install client + test dependencies
        run: python -m pip install -e "./clients/python[dev]"

      - name: Run Python parity and adversarial tests
        run: python -m pytest -q clients/python/tests

      - name: Install Rust stable for parity-vector drift check
        if: matrix.python-version == '3.14'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - name: Verify committed Python vectors match Rust
        if: matrix.python-version == '3.14'
        shell: bash
        run: |
          cargo run --locked -p olympus-manifest --example gen_python_vectors > generated-python-vectors.json
          diff -u clients/python/tests/vectors.json generated-python-vectors.json

  # ── Proof-tooling JavaScript tests ──────────────────────────────────────────
  proofs-js:
    name: proof helper tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proofs-js == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: proofs/package-lock.json

      - name: Install proof-tooling dependencies
        run: npm ci --ignore-scripts --prefix proofs

      - name: Run proof helper tests
        run: npm run test:jsonpath --prefix proofs

  # ── Rust lint gate (rustfmt + clippy) ────────────────────────────────────────
  # CI enforcement of the same commands the .githooks/pre-push hook runs
  # locally. Without this gate the audit-critical clippy.toml rules (e.g. the
  # disallowed-methods guard that keeps callers off ark_snark::Groth16::prove —
  # root cause of #1011) only fire for contributors who opted into the hooks.
  # Default features (= prover) so the lint surface matches production builds;
  # `--all-targets` lints tests/benches/examples too.
  rust-lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in git config while running PR-controlled
          # `cargo clippy` (build scripts execute). Matches federation-check.
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: Install Linux system dependencies
        # src-tauri links GTK/webkit even for clippy's type-check pass. Same
        # apt hardening (retry loop + per-call timeout) as the desktop jobs
        # (see #1058).
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          sudo -E timeout 300 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            mold

      - name: cargo clippy (workspace, -D warnings)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # ── Federation feature compiles + tests ──────────────────────────────────────
  # The desktop test jobs build only `--features prover`, so the arti/Tor stack
  # (arti-client, tor-rtcompat, tor-hsservice, …) and src-tauri/src/federation/
  # are otherwise NEVER compiled in CI — a tor-* dependency bump can pass green
  # while failing to compile under `--features federation` (e.g. #1198, where
  # two tor-rtcompat versions' Runtime types don't unify). Type-check first for
  # a focused diagnostic, then run Olympus's federation library tests and
  # equivocation integration target without pulling every dependency's tests.
  federation-check:
    name: federation feature compiles + tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in git config while running PR-controlled
          # `cargo check` (build scripts execute). Matches macos-ci.yml.
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system dependencies
        # Mirrors the tauri-unit job: src-tauri links GTK/webkit even for a
        # `cargo check`. Same apt hardening (retry loop + per-call timeout) as
        # the desktop jobs (see #1058).
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          sudo -E timeout 300 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            mold

      - name: cargo check (federation feature)
        run: cargo check --locked -p olympus-desktop --no-default-features --features federation

      - name: Federation unit + equivocation tests
        run: >-
          cargo nextest run --locked --profile ci -p olympus-desktop
          --no-default-features --features federation
          --lib --test federation_equivocation

  # ── Vendored light-poseidon provenance (audit L-20) ──────────────────────────
  # Fails CI if `crates/light-poseidon` has drifted from the upstream pinned
  # SHA outside the documented arkworks-version edits. See
  # `crates/light-poseidon/PROVENANCE.md` for the re-vendor procedure.
  light-poseidon-provenance:
    name: light-poseidon provenance check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored copy matches upstream pin
        run: bash scripts/check_light_poseidon_upstream.sh

  # ── light-poseidon seed reproducibility (L-20 companion) ─────────────────────
  # Proves `crates/light-poseidon/bn254_x5_seed.json` (a compact ~0.6 MB seed,
  # 4 little-endian u64 limbs per BN254 field element) reproduces the committed
  # ~1.5 MB parameter table that L-20 pins to upstream — for every Circom width
  # (t = 2..=13). Drives the test
  # `olympus_crypto::poseidon::tests::seed_reproduces_light_poseidon_parameters`.
  # Combined with the L-20 byte-for-byte check above, this transitively pins the
  # seed to upstream so a drifting seed fails CI before any proof uses it.
  light-poseidon-seed:
    name: light-poseidon seed reproduces params
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0
      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest
      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
      - name: Verify seed reproduces the committed Poseidon parameters
        run: cargo nextest run --locked --profile ci -p olympus-crypto --features poseidon seed_reproduces_light_poseidon_parameters

  # ── Vendored circomlib provenance ────────────────────────────────────────────
  # Fails CI if `proofs/vendor/circomlib/circuits/` has drifted from the
  # pinned upstream `iden3/circomlib` tag. See
  # `proofs/vendor/circomlib/PROVENANCE.md` for the re-vendor procedure.
  circomlib-provenance:
    name: circomlib provenance check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored copy matches upstream pin
        run: bash scripts/check_circomlib_upstream.sh

  # ── Formal circuit verification (circomspect static analysis) ────────────────
  # Source-level static analysis of every Circom circuit via Trail of Bits'
  # circomspect. Pure analysis — no circuit compilation, witness, or ceremony
  # artifact required, so it is fast and deterministic.
  #
  # GATING: circomspect.sh is strict by default and fails on any finding that is
  # not in proofs/circomspect_baseline.txt (the reviewed, accepted false-positive
  # set — see proofs/FORMAL_VERIFICATION.md). A *new* finding — including a new
  # instance of an already-accepted rule class at a new source line — blocks the
  # build. To accept a reviewed new finding, run
  # `bash proofs/circomspect.sh --update-baseline` and commit the diff.
  formal-circuit-verify:
    name: formal circuit verification (circomspect)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proofs == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
          key: circomspect

      - name: Install circomspect
        run: cargo install circomspect --version 0.9.0 --locked

      - name: Run circomspect static analysis (gating, baseline-diffed)
        # Strict by default: fails on any finding not in
        # proofs/circomspect_baseline.txt. python3 (preinstalled on the runner)
        # powers the SARIF → signature baseline diff.
        run: bash proofs/circomspect.sh --ci --level WARNING

      - name: Upload circomspect results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: circomspect-results
          path: |
            proofs/build/circomspect_results.json
            proofs/build/circomspect/
          if-no-files-found: ignore

  # ── Vendored glib-0.18.5-patched provenance (audit M-SC-1) ───────────────────
  # Fails CI if `crates/glib-0.18.5-patched/` has drifted from the published
  # `glib-0.18.5` crate beyond the documented GHSA-wrw7-89jp-8q8g backport.
  # This ~52k-LoC tree links into every Linux build; the other two vendored
  # trees (light-poseidon, circomlib) already have this gate. See
  # `crates/glib-0.18.5-patched/PROVENANCE.md` for the re-vendor procedure.
  glib-provenance:
    name: glib provenance check
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored copy matches published crate
        run: bash scripts/check_glib_upstream.sh

  # ── Rust verifier fuzz ───────────────────────────────────────────────────────
  cargo-fuzz-verifier:
    name: Cargo fuzz Olympus verifier (30 s per target)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-verifier == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        run: rustup toolchain install nightly-2026-07-20 --no-self-update

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: verifiers/rust -> target
          key: nightly

      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-20 install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz verify_merkle_proof (30 s)
        working-directory: verifiers/rust
        run: cargo +nightly-2026-07-20 fuzz run fuzz_verify_merkle_proof -- -max_total_time=30

      - name: Fuzz compute_merkle_root (30 s)
        working-directory: verifiers/rust
        run: cargo +nightly-2026-07-20 fuzz run fuzz_compute_merkle_root -- -max_total_time=30

      - name: Fuzz ADR-0030 redaction bundle verifier (30 s)
        working-directory: verifiers/rust
        run: cargo +nightly-2026-07-20 fuzz run fuzz_redaction_bundle -- -max_total_time=30

  # ── Canonical Rust crypto fuzz targets ──────────────────────────────────────
  # The root fuzz workspace is separate from verifiers/rust/fuzz. Keep both
  # suites wired: these targets exercise olympus-crypto itself.
  cargo-fuzz-crypto:
    name: Cargo fuzz canonical crypto (30 s per target)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.crypto-fuzz == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        run: rustup toolchain install nightly-2026-07-20 --no-self-update

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: fuzz -> fuzz/target
          key: nightly-root-fuzz

      - name: Install cargo-fuzz
        run: cargo +nightly-2026-07-20 install cargo-fuzz --version 0.13.2 --locked

      - name: Fuzz crypto primitives (30 s)
        working-directory: fuzz
        run: cargo +nightly-2026-07-20 fuzz run fuzz_crypto_primitives -- -max_total_time=30

      - name: Fuzz sparse Merkle tree (30 s)
        working-directory: fuzz
        run: cargo +nightly-2026-07-20 fuzz run fuzz_smt -- -max_total_time=30

  # ── Supply-chain audit (Rust + Node) ────────────────────────────────────────
  supply-chain:
    name: supply-chain (sbom + audit)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.deps == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        run: rustup toolchain install stable --no-self-update && rustup default stable

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"

      # pnpm is the source-of-truth package manager for the app/public-ui
      # workspace; `pnpm audit` (below) reads pnpm-lock.yaml + the
      # auditConfig.ignoreGhsas suppressions in pnpm-workspace.yaml. Audit
      # only needs the lockfile, so no `pnpm install` step is required.
      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Cache cargo-audit binary
        id: cache-cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-0.21

      - name: Install cargo-audit
        if: steps.cache-cargo-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Rust dependency vulnerability audit
        run: |
          IGNORE_ARGS=$(grep -v '^[[:space:]]*#' cargo-audit-baseline.txt | awk 'NF {printf "--ignore %s ", $1}')
          # Audit M-SC-2: audit EVERY tracked lockfile, not just the workspace
          # + verifier roots. The fuzz-harness lockfiles (fuzz/,
          # verifiers/rust/fuzz/) are dev-only and not shipped, but the `deps`
          # change-filter already triggers this job on any `**/Cargo.lock`
          # edit — so audit what we trigger on.
          while IFS= read -r lock; do
            echo "::group::cargo audit ${lock}"
            cargo audit --file "${lock}" ${IGNORE_ARGS}
            echo "::endgroup::"
          done < <(git ls-files '*Cargo.lock')

      - name: Node.js dependency vulnerability audit
        run: |
          npm audit --prefix verifiers/javascript --audit-level=high
          # app/public-ui is a pnpm workspace member — audit the real
          # pnpm-lock.yaml (honoring auditConfig.ignoreGhsas in
          # pnpm-workspace.yaml) instead of a stale npm package-lock.json
          # shadow that periodically drifts (audit L-SC-5). pnpm audit has no
          # working per-package --filter, so run it from the package dir.
          (cd app/public-ui && pnpm audit --audit-level high)
          # NOTE: proofs is also a pnpm member with the same npm-shadow class;
          # left on npm audit here as a scoped follow-up.
          npm audit --prefix proofs --audit-level=critical

      # ── License + source policy (deny.toml) ──────────────────────────────────
      # Machine-enforced version of THIRD_PARTY_LICENSES.md. Catches a new
      # dep with an unexpected license (GPL slipping into the Cargo graph,
      # an unknown registry, a wildcard version) before it ships.
      - name: Cache cargo-deny binary
        id: cache-cargo-deny
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          # Cache key MUST match the --version pin below — same pin invariant
          # as cargo-cyclonedx / cargo-mutants. Bump deliberately.
          key: cargo-deny-0.16.4

      - name: Install cargo-deny
        if: steps.cache-cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --locked --version 0.16.4

      # `bans licenses sources` only — NOT `advisories`. Vulnerability /
      # advisory scanning is already done by `cargo audit` above; running it
      # again here is redundant, and cargo-deny 0.16.4's bundled rustsec
      # parser chokes on newer advisory-DB entries (e.g. RUSTSEC-2026-0035),
      # which is a tool-vs-DB version skew, not a real finding. Keep
      # cargo-deny focused on the policy it owns: licenses, bans, sources.
      - name: cargo deny check (workspace)
        run: cargo deny --all-features check bans licenses sources

      - name: cargo deny check (verifiers/rust)
        run: cargo deny --all-features --manifest-path verifiers/rust/Cargo.toml check bans licenses sources

      # The standalone CLI is outside the root workspace. Its two public path
      # dependencies intentionally omit versions, so the root wildcard-path
      # policy cannot be applied verbatim; license and source policy still can.
      - name: cargo deny check (clients/cli licenses + sources)
        run: cargo deny --all-features --manifest-path clients/cli/Cargo.toml check licenses sources

      - name: Cache cargo-vet binary
        id: cache-cargo-vet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-vet
          key: cargo-vet-0.10.2

      - name: Install cargo-vet
        if: steps.cache-cargo-vet.outputs.cache-hit != 'true'
        run: cargo install cargo-vet --locked --version 0.10.2

      - name: cargo vet check (runtime workspace)
        run: cargo vet --locked

      # ── SBOM generation (audit M-4) ──────────────────────────────────────────
      # SECURITY.md / threat-model.md claim SBOMs are produced; this is where
      # that claim actually becomes true. We emit CycloneDX SBOMs for every
      # consumer-facing artifact (Rust workspace, Rust verifier, JS frontend,
      # JS verifier, proofs ceremony tooling) and upload them as a single
      # workflow artifact. Release tooling can pull from the same run.
      - name: Cache cargo-cyclonedx binary
        id: cache-cyclonedx
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          # Cache key MUST match CARGO_CYCLONEDX_VERSION below — same
          # pin invariant as cargo-mutants in mutation-testing.yml.
          key: cargo-cyclonedx-0.5.9

      - name: Install cargo-cyclonedx
        if: steps.cache-cyclonedx.outputs.cache-hit != 'true'
        # Pin to the version implied by the cache key; unpinned
        # `cargo install` could store a newer release under a key that
        # claims a specific version, drifting silently across runs.
        # Bump deliberately when reviewing a newer cargo-cyclonedx
        # changelog.
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate Rust SBOMs (CycloneDX)
        run: |
          mkdir -p sbom
          # cargo-cyclonedx writes `<crate-name>.cdx.json` next to each
          # crate's Cargo.toml. `--override-filename` accepts only a
          # basename (no path separators) so we let the tool use the
          # natural per-crate names and gather the files afterwards.
          # Workspace pass — one SBOM per member crate.
          cargo cyclonedx --format json --all
          # verifiers/rust is workspace-excluded, generate separately.
          (cd verifiers/rust && cargo cyclonedx --format json)
          # Move every produced .cdx.json into sbom/. Restrict to the
          # known crate dirs so nothing under target/ leaks in. Use
          # `mv -n` (no-clobber) and explicitly fail the job if the
          # destination already exists — workspace crate names are
          # unique by Cargo enforcement so this is unreachable today,
          # but a silent overwrite would drop one crate's SBOM if a
          # future refactor ever broke that invariant. Better to surface
          # the collision loudly than ship an incomplete SBOM artifact.
          while IFS= read -r src; do
            dst="sbom/$(basename "$src")"
            if [ -e "$dst" ]; then
              echo "::error::SBOM filename collision at $dst (sources include $src)" >&2
              exit 1
            fi
            mv -n "$src" "$dst"
          done < <(find src-tauri crates pg-embed-local verifiers/rust \
                     -maxdepth 2 -name '*.cdx.json')

      - name: Generate Node SBOMs (CycloneDX)
        env:
          # Pin to a known-good release rather than `@latest` so an upstream
          # bump can't silently change SBOM output between CI runs. Bump
          # deliberately when reviewing a newer CycloneDX-npm changelog.
          CYCLONEDX_NPM_VERSION: "4.2.1"
        run: |
          mkdir -p sbom
          # public-ui is built from the workspace pnpm-lock.yaml, so generate
          # its SBOM with pnpm from that same graph. Creating an npm lockfile
          # here would describe a fresh npm resolution rather than the bytes CI
          # and the release workflow actually build.
          pnpm --dir app/public-ui sbom \
            --sbom-format cyclonedx \
            --lockfile-only > sbom/public-ui.cdx.json
          test -s sbom/public-ui.cdx.json
          jq -e '
            .bomFormat == "CycloneDX" and
            .metadata.component.name == "public-ui" and
            any(.metadata.tools.components[]?; .name == "pnpm") and
            (.components | length > 0)
          ' sbom/public-ui.cdx.json >/dev/null

          # The standalone verifier and proof tooling still use committed npm
          # package-lock files, so cyclonedx-npm remains correct for them.
          for pair in "verifiers/javascript:verifier-javascript" \
                      "proofs:proofs-tooling"; do
            prefix="${pair%:*}"
            name="${pair#*:}"
            npx --yes "@cyclonedx/cyclonedx-npm@${CYCLONEDX_NPM_VERSION}" \
              --output-format JSON \
              --output-file "sbom/${name}.cdx.json" \
              --package-lock-only \
              --ignore-npm-errors \
              "$prefix/package.json"
          done

      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom/
          retention-days: 90
          if-no-files-found: error

  # ── Tauri desktop unit tests ─────────────────────────────────────────────────
  tauri-unit:
    name: tauri desktop unit tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: Install Linux system dependencies
        # Hardened against the apt hang that ate the full 6 h job budget on PR
        # #1058 (an Ubuntu mirror dropped a connection mid-fetch and apt blocked
        # forever waiting for the rest). Three lines of defense:
        #   1. step-level `timeout-minutes` caps the whole step at 20 min so a
        #      stuck apt can never consume the job's 6 h budget;
        #   2. `timeout N apt-get …` caps each individual apt invocation so a
        #      mirror-level stall surfaces as a non-zero exit, not a hang;
        #   3. retry loop on `apt-get update` (3 attempts) absorbs transient
        #      mirror flakes without re-running the whole job.
        # DEBIAN_FRONTEND=noninteractive + APT_LISTCHANGES_FRONTEND=none make
        # sure no postinst can ever pop a prompt (which would also hang).
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          sudo -E timeout 600 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            mold

      - name: Set up Node.js (for ceremony npm tooling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"

      - name: ZK ceremony artifacts (cached)
        uses: ./.github/actions/zk-ceremony-artifacts

      # `src-tauri` is only one workspace member. Run the library suites
      # explicitly so olympus-manifest, olympus-crypto, light-poseidon, and
      # babyjubjub-permissive are merge-gating rather than coverage-only.
      - name: cargo nextest (non-desktop workspace libraries)
        run: cargo nextest run --locked --profile ci --workspace --exclude olympus-desktop --all-features

      - name: Regenerate and compare cross-language golden vectors
        shell: bash
        run: |
          set -euo pipefail
          cargo run --locked -p olympus-crypto --example gen_ssmf_vectors --features smt > generated-ssmf.json
          jq -e --slurpfile generated generated-ssmf.json '
            .ssmf_existence_proof == $generated[0].ssmf_existence_proof and
            .ssmf_nonexistence_proof == $generated[0].ssmf_nonexistence_proof
          ' verifiers/test_vectors/vectors.json >/dev/null

          cargo run --locked -p olympus-crypto --example gen_redaction_vectors --features redaction
          cargo run --locked -p olympus-desktop --no-default-features --example gen_checkpoint_quorum_vectors
          cargo run --locked -p babyjubjub-permissive --example gen_rust_eddsa_vectors
          git diff --exit-code -- \
            verifiers/test_vectors/redaction_vectors.json \
            verifiers/test_vectors/checkpoint_quorum_vectors.json \
            verifiers/javascript/rust_eddsa_vectors.json

      # `--tests` runs both lib unit tests AND integration tests in
      # src-tauri/tests/. The embedded-Postgres binaries are excluded here and
      # run once-per-binary by cargo test below. Nextest's process-per-test model
      # would otherwise defeat their shared static harness and leak one pg_embed
      # cluster per test until initdb exhausts the runner.
      #
      # This common job runs the LEAN build
      # (`--no-default-features`): with `prover` off, `ark-circom` and its
      # wasmer/cranelift stack are not compiled, which is the bulk of this
      # job's wall-clock. The Groth16 prove/verify roundtrips live in the
      # separate `tauri-prover-tests` job below (the `zk_prove_*` targets
      # declare `required-features = ["prover", "zk-test-utils"]`, so they are
      # simply skipped here).
      - name: cargo nextest (olympus-desktop, lean / no prover, non-DB)
        working-directory: src-tauri
        env:
          # CI build-speed only — NOT a behavior change. `mold` slashes the
          # link of the fat per-test-file binaries; `line-tables-only`
          # debuginfo cuts codegen + link size while keeping file:line in
          # panic backtraces.
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: |
          source ../scripts/embedded-postgres-tests.sh
          cargo nextest run --locked --profile ci --no-default-features --tests \
            -E "$EMBEDDED_POSTGRES_NEXTEST_FILTER"

      - name: cargo test (embedded PostgreSQL integration binaries)
        working-directory: src-tauri
        timeout-minutes: 20
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: |
          source ../scripts/embedded-postgres-tests.sh
          cargo test --locked --no-default-features \
            "${EMBEDDED_POSTGRES_CARGO_TEST_ARGS[@]}" \
            -- --test-threads=1

      - name: cargo nextest (opt-in segmenter + dev-route features)
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: >-
          cargo nextest run --locked --profile ci --no-default-features
          --features textrun-segmenter,dev-signing-route --lib

      - name: cargo test doctests (workspace)
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: cargo test --locked --doc --workspace

  # ── Tauri ZK prover tests (heavy: ark-circom/wasmer) ─────────────────────────
  # Split out from `tauri-unit` so the common test path doesn't pay the
  # wasmer/cranelift compile. Runs the full Groth16 prove/verify roundtrips
  # under `--features prover,zk-test-utils` (the `zk_prove_*` integration
  # targets require both). Same system deps + ceremony artifacts as tauri-unit.
  tauri-prover-tests:
    name: tauri ZK prover tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust-app == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@37ba67210166984a515120020147f0b4ae3b8667 # nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
          key: prover

      - name: Install Linux system dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          sudo -E timeout 300 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            mold

      - name: Set up Node.js (for ceremony npm tooling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"

      - name: ZK ceremony artifacts (cached)
        uses: ./.github/actions/zk-ceremony-artifacts

      # `zk-test-utils` exposes the audit-M-5 escape hatches on
      # `CircomProvingKey` needed by `tests/zk_prove_existence.rs`'s #1011
      # side-by-side parity diagnostic; `prover` compiles the in-process
      # Groth16 prover. Together they enable the full prove/verify roundtrip.
      - name: cargo nextest (olympus-desktop, prover + zk-test-utils)
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: cargo nextest run --locked --profile ci --features prover,zk-test-utils --tests

      # The quorum circuit is next-phase and is not part of the default desktop
      # feature set. Compile and run its gated unit tests explicitly so the
      # fourth generated circuit and Rust witness/prove/verify paths cannot rot.
      - name: cargo nextest (quorum-circuit feature)
        working-directory: src-tauri
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
          CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
        run: >-
          cargo nextest run --locked --profile ci
          --no-default-features --features prover,quorum-circuit --lib

  # ── Frontend type-check + Vite production build ──────────────────────────────
  frontend-build:
    name: frontend type-check + build
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.ci == 'true'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "11.1.2"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend unit tests
        working-directory: app/public-ui
        run: pnpm test:run

      - name: TypeScript type-check
        working-directory: app/public-ui
        run: pnpm exec tsc --noEmit

      - name: ESLint
        # Same gate the .githooks/pre-push hook runs locally — without this
        # step the eslint config (react-hooks rules etc.) is never enforced
        # for contributors who haven't opted into the hooks.
        working-directory: app/public-ui
        run: pnpm exec eslint .

      - name: Vite production build
        working-directory: app/public-ui
        run: pnpm build
