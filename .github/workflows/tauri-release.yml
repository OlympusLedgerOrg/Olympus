name: Tauri Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: tauri-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: release tests + ZK artifact preflight
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # Production ceremony artifacts may be committed through Git LFS.
          lfs: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          tool: nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ". -> target"
          key: release-preflight

      - name: Install Linux system dependencies
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          sudo -E timeout 900 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend unit tests + production build
        run: |
          pnpm --filter public-ui test:run
          pnpm --filter public-ui build

      - name: Proof helper tests
        run: pnpm --dir proofs test:jsonpath

      # Manual dispatches produce explicitly non-production test bundles. Tag
      # releases never use this action because it intentionally creates a
      # single-contributor development ceremony.
      - name: Restore or generate development ZK artifacts for manual bundles
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
        uses: ./.github/actions/zk-ceremony-artifacts

      # A tagged release must consume the multi-contributor bundle supplied by
      # its source ref (directly or through Git LFS), never CI-generated keys.
      - name: Reject incomplete or development ZK tag inputs
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          circuits=(
            document_existence
            non_existence
            unified_canonicalization_inclusion_root_sign
          )
          for c in "${circuits[@]}"; do
            manifest="proofs/keys/manifests/${c}_manifest.json"
            required=(
              "proofs/keys/${c}.r1cs"
              "proofs/keys/${c}.wasm"
              "proofs/keys/${c}.ark.zkey"
              "proofs/keys/verification_keys/${c}_vkey.json"
              "$manifest"
            )
            for artifact in "${required[@]}"; do
              if [ ! -s "$artifact" ]; then
                echo "::error::Missing or empty release ceremony artifact: $artifact"
                exit 1
              fi
              if head -c 256 "$artifact" | grep -Eaq 'PLACEHOLDER|"placeholder"'; then
                echo "::error::Release input is still a placeholder: $artifact"
                exit 1
              fi
            done

            ceremony_id="$(jq -er '.ceremony_id' "$manifest")"
            if [[ "$ceremony_id" == olympus-dev-* ]]; then
              echo "::error::${c} uses development ceremony id ${ceremony_id}"
              exit 1
            fi

            # Prover tests read proofs/build. Stage exact copies so they test
            # the same runtime bytes uploaded for every packaging matrix leg.
            mkdir -p "proofs/build/${c}_js"
            cp "proofs/keys/${c}.r1cs" "proofs/build/${c}.r1cs"
            cp "proofs/keys/${c}.wasm" "proofs/build/${c}_js/${c}.wasm"
            cp "proofs/keys/${c}.ark.zkey" "proofs/build/${c}_final.ark.zkey"
          done

      - name: Invalidate binaries with embedded ceremony data
        # include_str! inputs are outside Cargo's normal source graph; a cache
        # restore can otherwise reuse a binary embedding an older manifest.
        run: cargo clean -p olympus-desktop

      - name: Verify manifest chains and release artifact hashes
        env:
          IS_TAG_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') }}
          OLYMPUS_CEREMONY_TRUSTED_CONTRIBUTORS_JSON: ${{ vars.OLYMPUS_CEREMONY_TRUSTED_CONTRIBUTORS_JSON }}
        run: |
          set -euo pipefail
          contributor_policy_args=()
          if [[ "$IS_TAG_RELEASE" == "true" ]]; then
            contributor_policy_args=(--minimum-authenticated-contributors 3)
          fi
          for circuit in \
            document_existence \
            non_existence \
            unified_canonicalization_inclusion_root_sign; do
            cargo run --locked -p olympus-desktop --no-default-features \
              --bin verify_ceremony_bundle -- \
              --circuit "$circuit" --keys-dir proofs/keys \
              "${contributor_policy_args[@]}"
          done

      # Tag builds additionally require three distinct, signed contribution
      # rows whose keys are authorized by the independently managed repository
      # variable above. A coordinator-authored JSON row cannot count by itself.
      - name: Test non-desktop Rust workspace libraries
        run: cargo nextest run --locked --profile ci --workspace --exclude olympus-desktop --all-features

      - name: Test desktop lean integration suite
        working-directory: src-tauri
        run: cargo nextest run --locked --profile ci --no-default-features --tests

      - name: Test desktop prover integration suite
        working-directory: src-tauri
        run: cargo nextest run --locked --profile ci --features prover,zk-test-utils --tests

      - name: Test workspace doctests
        run: cargo test --locked --doc --workspace

      - name: Upload tested ZK artifacts for release builders
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-zk-artifacts
          path: |
            proofs/keys/document_existence.wasm
            proofs/keys/document_existence.r1cs
            proofs/keys/document_existence.ark.zkey
            proofs/keys/non_existence.wasm
            proofs/keys/non_existence.r1cs
            proofs/keys/non_existence.ark.zkey
            proofs/keys/unified_canonicalization_inclusion_root_sign.wasm
            proofs/keys/unified_canonicalization_inclusion_root_sign.r1cs
            proofs/keys/unified_canonicalization_inclusion_root_sign.ark.zkey
            proofs/keys/verification_keys/document_existence_vkey.json
            proofs/keys/verification_keys/non_existence_vkey.json
            proofs/keys/verification_keys/unified_canonicalization_inclusion_root_sign_vkey.json
            proofs/keys/manifests/document_existence_manifest.json
            proofs/keys/manifests/non_existence_manifest.json
            proofs/keys/manifests/unified_canonicalization_inclusion_root_sign_manifest.json
          if-no-files-found: error
          retention-days: 7

  build:
    needs: preflight
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download preflight-tested ZK artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-zk-artifacts
          path: proofs/keys

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          # `toolchain` is required when the action is pinned to a SHA (the
          # `@stable` tag magic that infers it is lost on a commit pin). Without
          # this the step fails instantly with "'toolchain' is a required input"
          # on every platform — which is why release bundles never built.
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install cargo-nextest for native release-host tests
        if: matrix.os != 'ubuntu-22.04'
        uses: taiki-e/install-action@ed67fa35ac944f3a9b33f12c4dd43b6f31a47e20 # v2.83.3
        with:
          tool: nextest

      - name: Rust cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: ". -> target"

      - name: Invalidate binaries with embedded ceremony data
        # The downloaded vkeys/manifests must be re-embedded even when the
        # target cache contains a build from an earlier ceremony.
        run: cargo clean -p olympus-desktop

      - name: Install pnpm
        # No `version:` — the action reads packageManager (pnpm@11.x) from
        # package.json. Passing an explicit version conflicts and errors with
        # "Multiple versions of pnpm specified".
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        # See ci.yml for the apt-hardening rationale (step-level timeout +
        # per-invocation timeout + retry loop).
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          sudo -E timeout 300 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Windows and both macOS architectures execute native tests on the same
      # runner that will package them. Linux already ran the broader preflight.
      - name: Native release-host Rust tests
        if: matrix.os != 'ubuntu-22.04'
        run: |
          cargo nextest run --locked --profile ci --workspace --exclude olympus-desktop --all-features
          cargo nextest run --locked --profile ci -p olympus-desktop --no-default-features --features prover --lib
          cargo nextest run --locked --profile ci -p olympus-desktop --no-default-features --features prover --test api_admin_users --test api_cors_preflight --test snapshot_cross_crate_parity --test zk_witness_proptest

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate icons from source SVG
        run: cargo tauri icon src-tauri/icons/source.svg

      # The required preflight qualifies the source and exact ZK runtime bytes;
      # the native Windows/macOS legs add host-specific tests before packaging.

      - name: Import Windows Authenticode signing certificate
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CERTIFICATE_BASE64 is required for a tagged Windows release"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required for a tagged Windows release"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) {
            throw "WINDOWS_TIMESTAMP_URL is required for a tagged Windows release"
          }
          $timestampUri = [Uri]$env:WINDOWS_TIMESTAMP_URL
          if (-not $timestampUri.IsAbsoluteUri -or $timestampUri.Scheme -ne "https") {
            throw "WINDOWS_TIMESTAMP_URL must be an absolute HTTPS URL"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "olympus-authenticode.pfx"
          try {
            $bytes = [Convert]::FromBase64String(
              ($env:WINDOWS_CERTIFICATE_BASE64 -replace '\s', '')
            )
          } catch {
            throw "WINDOWS_CERTIFICATE_BASE64 is not valid base64"
          }
          [IO.File]::WriteAllBytes($pfxPath, $bytes)
          "WINDOWS_CERTIFICATE_PATH=$pfxPath" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD `
            -AsPlainText -Force
          $imported = @(
            Import-PfxCertificate `
              -FilePath $pfxPath `
              -CertStoreLocation Cert:\CurrentUser\My `
              -Password $password
          )
          $importedThumbprints = @(
            $imported |
              ForEach-Object { $_.Thumbprint } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          "WINDOWS_IMPORTED_THUMBPRINTS=$($importedThumbprints -join ';')" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $codeSigningOid = "1.3.6.1.5.5.7.3.3"
          $signers = @(
            foreach ($certificate in $imported) {
              $eku = $certificate.Extensions |
                Where-Object { $_.Oid.Value -eq "2.5.29.37" }
              $ekuOids = @(
                $eku.EnhancedKeyUsages | ForEach-Object { $_.Value }
              )
              if ($certificate.HasPrivateKey -and $ekuOids -contains $codeSigningOid) {
                $certificate
              }
            }
          )
          if ($signers.Count -ne 1) {
            throw "PFX must contain exactly one private-key code-signing certificate"
          }
          $signer = $signers[0]
          $now = Get-Date
          if ($signer.NotBefore -gt $now -or $signer.NotAfter -lt $now) {
            throw "Windows code-signing certificate is not currently valid"
          }

          $configPath = Join-Path $env:GITHUB_WORKSPACE `
            "src-tauri\tauri.windows-signing.conf.json"
          $config = [ordered]@{
            bundle = [ordered]@{
              windows = [ordered]@{
                certificateThumbprint = $signer.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = $timestampUri.AbsoluteUri
              }
            }
          }
          $config | ConvertTo-Json -Depth 4 |
            Set-Content -LiteralPath $configPath -Encoding utf8NoBOM

          "WINDOWS_SIGNER_THUMBPRINT=$($signer.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # macOS code-signing + notarization. Gated on tag releases only:
          # tauri-action attempts a `security import` of APPLE_CERTIFICATE
          # whenever it's non-empty, which fails (exit 1) when the secret is an
          # unconfigured placeholder. On workflow_dispatch / branch builds these
          # resolve to "" so tauri-action skips signing and emits an UNSIGNED
          # bundle (fine for testing — recipients use right-click→Open or
          # `xattr -cr <App>`). On a `v*` tag the real secrets flow through and
          # the bundle is signed/notarized (once the APPLE_* secrets are set).
          APPLE_ID: ${{ startsWith(matrix.os, 'macos-') && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ startsWith(matrix.os, 'macos-') && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ startsWith(matrix.os, 'macos-') && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_TEAM_ID || '' }}
          APPLE_CERTIFICATE: ${{ startsWith(matrix.os, 'macos-') && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ startsWith(matrix.os, 'macos-') && startsWith(github.ref, 'refs/tags/') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        with:
          target: ${{ matrix.target }}
          args: >-
            --target ${{ matrix.target }}
            ${{ matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/') && '--config src-tauri/tauri.windows-signing.conf.json' || '' }}

      - name: Verify Windows Authenticode signatures and timestamp
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundle = Join-Path $env:GITHUB_WORKSPACE `
            "target\${{ matrix.target }}\release\bundle"
          $msi = @(Get-ChildItem -LiteralPath (Join-Path $bundle "msi") -Filter *.msi -File)
          $nsis = @(Get-ChildItem -LiteralPath (Join-Path $bundle "nsis") -Filter *.exe -File)
          if ($msi.Count -ne 1 -or $nsis.Count -ne 1) {
            throw "Tagged Windows release must contain exactly one MSI and one NSIS installer"
          }

          $application = Join-Path $env:GITHUB_WORKSPACE `
            "target\${{ matrix.target }}\release\olympus-desktop.exe"
          if (-not (Test-Path -LiteralPath $application -PathType Leaf)) {
            throw "Windows application executable was not built"
          }

          foreach ($file in @($application, $msi[0].FullName, $nsis[0].FullName)) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file
            if ($signature.Status -ne "Valid") {
              throw "Invalid Authenticode signature for $file`: $($signature.StatusMessage)"
            }
            if ($signature.SignerCertificate.Thumbprint -ne $env:WINDOWS_SIGNER_THUMBPRINT) {
              throw "Unexpected Authenticode signer for $file"
            }
            if ($null -eq $signature.TimeStamperCertificate) {
              throw "Authenticode signature is not timestamped: $file"
            }
          }

      - name: Remove Windows signing material from runner
        if: ${{ always() && matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          foreach ($thumbprint in ($env:WINDOWS_IMPORTED_THUMBPRINTS -split ';')) {
            if ([string]::IsNullOrWhiteSpace($thumbprint)) {
              continue
            }
            Remove-Item -LiteralPath `
              "Cert:\CurrentUser\My\$thumbprint" `
              -Force -ErrorAction SilentlyContinue
          }
          if (-not [string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_PATH `
              -Force -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath `
            (Join-Path $env:GITHUB_WORKSPACE "src-tauri\tauri.windows-signing.conf.json") `
            -Force -ErrorAction SilentlyContinue

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olympus-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/rpm/*.rpm
          if-no-files-found: error

  provenance:
    name: release checksums + attestations
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: olympus-*
          path: release-assets

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # stable
        with:
          toolchain: stable

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate release SBOMs
        run: |
          set -euo pipefail
          mkdir -p sbom

          cargo cyclonedx --format json --manifest-path src-tauri/Cargo.toml
          mv src-tauri/olympus-desktop.cdx.json sbom/olympus-desktop.cdx.json

          pnpm --dir app/public-ui sbom --sbom-format cyclonedx --lockfile-only > sbom/public-ui.cdx.json
          test -s sbom/public-ui.cdx.json
          jq -e '
            .bomFormat == "CycloneDX" and
            .metadata.component.name == "public-ui" and
            any(.metadata.tools.components[]?; .name == "pnpm") and
            (.components | length > 0)
          ' sbom/public-ui.cdx.json >/dev/null

      - name: Stage and validate the complete release asset set
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse 'HEAD^{commit}')"
          node scripts/release-assets.mjs stage \
            --input release-assets \
            --sbom sbom \
            --output release-publish \
            --tag "$REF_NAME" \
            --commit "$source_commit" \
            --installer-checksums INSTALLER_SHA256SUMS
          cat release-publish/SHA256SUMS

      - name: Upload complete release asset set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olympus-release-assets
          path: release-publish/
          if-no-files-found: error

      - name: Prepare a draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$REF_NAME" \
            > existing-release.json 2>/dev/null; then
            if ! jq -e '.draft == true' existing-release.json >/dev/null; then
              echo "::error::Release $REF_NAME is already published; refusing to replace verified assets"
              exit 1
            fi
          else
            gh release create "$REF_NAME" \
              --draft \
              --generate-notes \
              --title "$REF_NAME" \
              --verify-tag
            printf '%s\n' '{"draft":true,"assets":[]}' > existing-release.json
          fi

          mkdir existing-release-assets
          : > release-assets-to-upload.txt

          # Draft releases are append-only. A retry may reuse an existing name
          # only when the already-uploaded bytes are identical to this run.
          while IFS=$'\t' read -r asset_id asset; do
            if [ "$(basename "$asset")" != "$asset" ] || [ ! -f "release-publish/$asset" ]; then
              echo "::error::Existing release asset is outside this run's contract: $asset"
              exit 1
            fi
            gh api \
              -H "Accept: application/octet-stream" \
              "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" \
              > "existing-release-assets/$asset"
            if [ "$(sha256sum "existing-release-assets/$asset" | cut -d ' ' -f 1)" != \
                 "$(sha256sum "release-publish/$asset" | cut -d ' ' -f 1)" ]; then
              echo "::error::Existing release asset differs from this run: $asset"
              exit 1
            fi
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' existing-release.json)

          while IFS= read -r asset; do
            if ! jq -e --arg name "$asset" '.assets | any(.name == $name)' \
              existing-release.json >/dev/null; then
              printf '%s\n' "release-publish/$asset" >> release-assets-to-upload.txt
            fi
          done < <(find release-publish -maxdepth 1 -type f -printf '%f\n' | sort)

      - name: Attach installers, checksums, manifest, and SBOMs to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t assets < release-assets-to-upload.txt
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "All release assets already exist with identical checksums."
            exit 0
          fi
          gh release upload "$REF_NAME" "${assets[@]}"

      - name: Verify the draft release asset contract
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir release-verification
          gh release download "$REF_NAME" --dir release-verification
          source_commit="$(git rev-parse 'HEAD^{commit}')"
          node scripts/release-assets.mjs verify \
            --input release-verification \
            --tag "$REF_NAME" \
            --commit "$source_commit"

      - name: Attest release asset provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-checksums: release-publish/SHA256SUMS

      - name: Attest Rust SBOM for release artifacts
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: INSTALLER_SHA256SUMS
          sbom-path: sbom/olympus-desktop.cdx.json

      - name: Attest frontend SBOM for release artifacts
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-checksums: INSTALLER_SHA256SUMS
          sbom-path: sbom/public-ui.cdx.json

      - name: Publish the verified GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: gh release edit "$REF_NAME" --draft=false
