name: Build CI Docker Image

# Rebuilds and pushes ghcr.io/olympusledgerorg/olympus-ci whenever
# docker/Dockerfile.ci changes on main. Also available via workflow_dispatch
# for manual rebuilds (e.g. after a Rust toolchain or circom version bump).
#
# The image is pulled by the `proofs` and `full` CI jobs to skip the ~4 min
# toolchain install phase. Bump circom/Rust versions in Dockerfile.ci, trigger
# this workflow, then update the circuit artifact cache key in ci.yml.

on:
  push:
    branches: [main]
    paths:
      - "docker/Dockerfile.ci"
  pull_request:
    paths:
      - "docker/Dockerfile.ci"
      - ".github/workflows/build-ci-image.yml"
  workflow_dispatch:

concurrency:
  group: build-ci-image
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push olympus-ci image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.ci
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ghcr.io/olympusledgerorg/olympus-ci:latest
            ghcr.io/olympusledgerorg/olympus-ci:${{ github.sha }}
          # Layer cache stored in GHA cache — subsequent builds only rebuild
          # changed layers (e.g. a circom version bump only re-runs that RUN).
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm ghcr.io/olympusledgerorg/olympus-ci:${{ github.sha }} \
            bash -lc 'rustc --version && cargo --version && node --version && circom --version'
