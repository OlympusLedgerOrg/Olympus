name: React Compiler Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/public-ui/**"
      - ".pnpmfile.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/react-compiler-smoke.yml"

concurrency:
  group: react-compiler-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: compiler-mode frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.1.2"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend unit tests
        run: pnpm --filter public-ui test:run

      - name: React Compiler build smoke
        run: pnpm --filter public-ui build:compiler
