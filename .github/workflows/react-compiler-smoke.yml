name: React Compiler Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/public-ui/**"
      - ".pnpmfile.cjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/react-compiler-smoke.yml"

concurrency:
  group: react-compiler-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: compiler-mode frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "11.1.2"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.19.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend unit tests
        run: pnpm --filter public-ui test:run

      - name: React Compiler build smoke
        run: pnpm --filter public-ui build:compiler
