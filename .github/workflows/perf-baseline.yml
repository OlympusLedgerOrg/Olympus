name: Performance Baseline

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Benchmark size"
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full
  schedule:
    - cron: "23 7 * * 2"

concurrency:
  group: perf-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  perf-baseline:
    name: perf baseline (${{ inputs.mode || 'quick' }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ (inputs.mode || 'quick') == 'full' && 240 || 60 }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.95.0

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
          key: perf-baseline

      - name: Install Linux system dependencies
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          sudo -E timeout 300 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            mold

      - name: Run performance baseline
        timeout-minutes: ${{ (inputs.mode || 'quick') == 'full' && 180 || 30 }}
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
          CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
        run: |
          bash scripts/perf_baseline.sh "${{ inputs.mode || 'quick' }}" | tee perf-baseline.log

      - name: Upload baseline log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-baseline-log
          path: perf-baseline.log
          if-no-files-found: error
