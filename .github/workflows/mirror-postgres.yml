name: Mirror postgres:16 -> GHCR

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC; adjust if needed

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull upstream postgres image
        run: docker pull postgres:16

      - name: Smoke-test PostgreSQL startup
        run: |
          set -euo pipefail
          docker run --detach --name olympus-postgres-smoke \
            --env POSTGRES_PASSWORD=ci-smoke-only \
            postgres:16
          trap 'docker rm --force olympus-postgres-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec olympus-postgres-smoke pg_isready --username postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs olympus-postgres-smoke
          exit 1

      - name: Tag and push to GHCR
        run: |
          TARGET=ghcr.io/${{ github.repository_owner }}/postgres:16
          docker tag postgres:16 $TARGET
          docker push $TARGET

      - name: Also tag as :latest (optional)
        run: |
          TARGET_LATEST=ghcr.io/${{ github.repository_owner }}/postgres:latest
          docker tag postgres:16 $TARGET_LATEST
          docker push $TARGET_LATEST
