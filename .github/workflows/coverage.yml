name: Coverage

# Measure root-workspace Rust and frontend coverage on every PR + push to main.
# Rust coverage is currently measurement-only. Frontend coverage is gating:
# vitest.config.ts defines minimum line/function/branch/statement thresholds.

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Skip the ~10-minute rust coverage rebuild on commits that touch
    # only docs / licenses / top-level metadata. `paths-ignore` is the
    # safe form: if ANY changed path falls outside the ignore set the
    # workflow still runs, so a mixed code+docs commit isn't skipped.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
      - ".editorconfig"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - ".gitignore"
      - ".editorconfig"

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect coverage scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'src-tauri/**'
              - 'crates/**'
              - 'proofs/**'
              - '.github/actions/zk-ceremony-artifacts/**'
              - '.github/workflows/coverage.yml'
            frontend:
              - '.pnpmfile.cjs'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'app/public-ui/**'
              - '.github/workflows/coverage.yml'

  rust-coverage:
    name: rust coverage (workspace)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust stable + llvm-tools
        run: |
          rustup toolchain install stable --component llvm-tools-preview --no-self-update
          rustup default stable

      - name: Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"
          key: coverage

      - name: Install Linux system deps (for src-tauri tests)
        # See ci.yml for rationale; mirrors the same step-level timeout +
        # per-invocation timeout + retry pattern that closes the 6 h apt-hang
        # vector.
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            if sudo -E timeout 240 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "apt-get update attempt $i failed; sleeping 5 s"
            sleep 5
            if [ "$i" = "3" ]; then
              echo "apt-get update failed 3 times — aborting"
              exit 1
            fi
          done
          sudo -E timeout 900 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js (for ceremony npm tooling)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"

      - name: ZK ceremony artifacts (cached)
        uses: ./.github/actions/zk-ceremony-artifacts

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a6b2e2dcd845ddd7f509ce4f3ed3d922b80cc5d9 # v2
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: cargo llvm-cov (workspace, default features = prover + zk-test-utils)
        # `zk-test-utils` is needed because tests/zk_prove_existence.rs
        # declares it under `required-features` (audit M-5 gating of the
        # CircomProvingKey escape hatches).
        run: |
          cargo llvm-cov --locked --workspace --features zk-test-utils \
            --summary-only --json --output-path coverage.json
          test -s coverage.json
          cargo llvm-cov report --summary-only

      - name: Per-crate breakdown into job summary
        if: always()
        run: |
          {
            echo "## Rust coverage (workspace, default features = prover enabled)"
            echo ""
            echo '| Crate | Lines | Functions | Regions |'
            echo '|---|---|---|---|'
            if [ -s coverage.json ]; then
              python3 - <<'PY' coverage.json
          import json, sys
          data = json.load(open(sys.argv[1]))
          totals = data.get("data", [{}])[0].get("totals", {})
          files = data.get("data", [{}])[0].get("files", [])
          # Group by top-level workspace member: src-tauri, crates/<name>, ...
          buckets = {}
          for f in files:
              fn = f.get("filename", "")
              # Skip target/ and registry paths
              if "/target/" in fn or "/.cargo/" in fn:
                  continue
              parts = fn.replace("\\", "/").split("/")
              if "src-tauri" in parts:
                  key = "src-tauri"
              elif "crates" in parts:
                  i = parts.index("crates")
                  key = "/".join(parts[i:i+2]) if i + 1 < len(parts) else "crates"
              else:
                  key = parts[0] if parts else "?"
              b = buckets.setdefault(key, {"lines": [0,0], "fns": [0,0], "regs": [0,0]})
              s = f.get("summary", {})
              for src, dst in [("lines","lines"),("functions","fns"),("regions","regs")]:
                  d = s.get(src, {})
                  b[dst][0] += d.get("covered", 0)
                  b[dst][1] += d.get("count", 0)
          def pct(c, t):
              return f"{(100.0*c/t):.1f}%" if t else "—"
          for k in sorted(buckets):
              b = buckets[k]
              print(f"| `{k}` | {pct(*b['lines'])} ({b['lines'][0]}/{b['lines'][1]}) | {pct(*b['fns'])} | {pct(*b['regs'])} |")
          # Workspace totals
          l = totals.get("lines", {})
          f = totals.get("functions", {})
          r = totals.get("regions", {})
          print(f"| **workspace total** | **{pct(l.get('covered',0), l.get('count',0))}** | **{pct(f.get('covered',0), f.get('count',0))}** | **{pct(r.get('covered',0), r.get('count',0))}** |")
          PY
            else
              echo '_(`coverage.json` was not produced; see the first failing step above.)_'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage
          path: coverage.json
          if-no-files-found: error
          retention-days: 30

  frontend-coverage:
    name: frontend coverage (vitest)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: "11.1.2"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.14.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vitest with coverage
        working-directory: app/public-ui
        run: pnpm coverage

      - name: Coverage summary into job summary
        if: always()
        working-directory: app/public-ui
        run: |
          {
            echo "## Frontend coverage (vitest)"
            echo ""
            if [ -f coverage/coverage-summary.json ]; then
              python3 - <<'PY'
          import json
          data = json.load(open("coverage/coverage-summary.json"))
          tot = data.get("total", {})
          def pct(d): return f"{d.get('pct', 0):.1f}% ({d.get('covered',0)}/{d.get('total',0)})"
          print("| Metric | Coverage |")
          print("|---|---|")
          for k in ("lines","statements","functions","branches"):
              print(f"| {k} | {pct(tot.get(k, {}))} |")
          PY
            else
              echo "_(no coverage-summary.json produced)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: app/public-ui/coverage/
          retention-days: 30
