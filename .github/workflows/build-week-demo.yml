name: Build Week Judge Demo

on:
  pull_request:
    paths:
      - ".github/workflows/build-week-demo.yml"
      - "src-tauri/Cargo.toml"
      - "src-tauri/src/bin/olympus_smt_demo.rs"
      - "src-tauri/src/zk/**"
      - "crates/olympus-crypto/src/canonical.rs"
      - "crates/olympus-crypto/src/canonical_proof.rs"
      - "crates/light-poseidon/**"
      - "proofs/zkvm/canonicalization/olympus_canonicalization_guest.elf"
      - "proofs/zkvm/canonicalization/olympus_canonicalization_guest.id"
      - "proofs/zkvm/canonicalization/receipt-fixture.json"
      - "migrations-sqlite/**"
      - "src-tauri/src/smt/**"
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish or refresh the public prerelease after all builds pass"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Release tag used when publishing"
        required: true
        default: "build-week-2026-demo-v2"
        type: string

concurrency:
  group: build-week-demo-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build and smoke (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: windows-x64
            executable: olympus-smt-demo.exe
            output: olympus-smt-demo-windows-x64.exe
          - os: ubuntu-22.04
            asset: linux-x64
            executable: olympus-smt-demo
            output: olympus-smt-demo-linux-x64
          - os: macos-15
            asset: macos-arm64
            executable: olympus-smt-demo
            output: olympus-smt-demo-macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable
        with:
          toolchain: stable

      - name: Configure Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\Program Files\OpenSSL"
          $include = Join-Path $root "include"
          $lib = Join-Path $root "lib\VC\x64\MT"
          if (-not (Test-Path (Join-Path $include "openssl\ssl.h")) -or
              -not (Test-Path (Join-Path $lib "libssl.lib")) -or
              -not (Test-Path (Join-Path $lib "libcrypto.lib"))) {
            throw "The runner's static OpenSSL development files are unavailable"
          }
          "OPENSSL_INCLUDE_DIR=$include" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_LIB_DIR=$lib" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "OPENSSL_STATIC=1" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          APT_LISTCHANGES_FRONTEND: none
        run: |
          set -euo pipefail
          sudo -E timeout 240 apt-get update -o Acquire::Retries=3
          sudo -E timeout 300 apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build standalone demo
        env:
          OLYMPUS_DEMO_BUILD_SHA: ${{ github.sha }}
        run: >-
          cargo build --locked --release -p olympus-desktop
          --no-default-features --bin olympus-smt-demo

      - name: Smoke test and stage asset
        shell: bash
        run: |
          set -euo pipefail
          binary="target/release/${{ matrix.executable }}"
          database="${RUNNER_TEMP}/olympus-build-week-demo.sqlite"
          "$binary" --database "$database" --reset | tee "smoke-output-${{ matrix.asset }}.json"
          python -c 'import json,sys; report=json.load(open(sys.argv[1], encoding="utf-8")); assert report["status"] == "PASS"; assert all(report["checks"].values())' "smoke-output-${{ matrix.asset }}.json"
          mkdir -p dist
          cp "$binary" "dist/${{ matrix.output }}"
          cp "smoke-output-${{ matrix.asset }}.json" dist/

      - name: Upload tested binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: olympus-smt-demo-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: publish public judge prerelease
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download tested binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: olympus-smt-demo-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f -name 'olympus-smt-demo-*' -print0 \
            | sort -z \
            | xargs -0 sha256sum > dist/SHA256SUMS
          test "$(wc -l < dist/SHA256SUMS)" -eq 3

      - name: Publish or refresh prerelease
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$ ]]; then
            echo "release_tag contains unsupported characters" >&2
            exit 2
          fi
          assets=(dist/olympus-smt-demo-* dist/SHA256SUMS)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_target="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')"
            if [[ "$release_target" != "$GITHUB_SHA" ]]; then
              echo "refusing to refresh $RELEASE_TAG: existing release targets $release_target, not $GITHUB_SHA" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "OpenAI Build Week 2026 judge demo" \
              --notes "Prebuilt, network-free Olympus judge demo: transactional SMT storage plus fixed-image zkVM canonicalization receipt verification. See JUDGES.md at commit $GITHUB_SHA for verification and testing instructions."
          fi
