version: 2
# Python and Go services are retired (v0.9.0). The verify-only Python client
# remains shipped and is covered below alongside every maintained Cargo root,
# the npm trees, and GitHub Actions. Removed stale entries (audit L-SC-1):
# pip /, gomod /verifiers/go, gomod
# /services/sequencer-go, and cargo /services/cdhs-smf-rust (trees deleted).
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "OlympusLedgerOrg"
    labels:
      - "dependencies"
      - "security"
    ignore:
      # v3 must move the root, verifier, and fuzz crates together; independent
      # bumps create incompatible VerifyingKey and rand_core types.
      - dependency-name: "ed25519-dalek"
        versions: [">=3"]
  - package-ecosystem: "cargo"
    directory: "/verifiers/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "OlympusLedgerOrg"
    labels:
      - "dependencies"
      - "security"
    ignore:
      - dependency-name: "ed25519-dalek"
        versions: [">=3"]
  - package-ecosystem: "cargo"
    directory: "/clients/cli"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "OlympusLedgerOrg"
    labels:
      - "dependencies"
      - "security"
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "OlympusLedgerOrg"
    labels:
      - "dependencies"
      - "security"
  - package-ecosystem: "cargo"
    directory: "/verifiers/rust/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "OlympusLedgerOrg"
    labels:
      - "dependencies"
      - "security"
    ignore:
      - dependency-name: "ed25519-dalek"
        versions: [">=3"]
  - package-ecosystem: "pip"
    directory: "/clients/python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "OlympusLedgerOrg"
    labels:
      - "dependencies"
      - "security"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "OlympusLedgerOrg"
    labels:
      - "dependencies"
      - "security"
    ignore:
      - dependency-name: "eslint"
        versions: [">=10"]
      # These majors currently violate the frontend toolchain's peer ranges.
      # Lift together in an explicit TypeScript/ESLint migration.
      - dependency-name: "@eslint/js"
        versions: [">=10"]
      - dependency-name: "typescript"
        versions: [">=7"]
  - package-ecosystem: "npm"
    directory: "/proofs"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "OlympusLedgerOrg"
    labels:
      - "dependencies"
      - "security"
    ignore:
      # jsonpath is pinned to file:./safe-jsonpath — a local security shim
      # that replaces the insecure upstream package. Dependabot cannot resolve
      # file: paths and errors out. The shim is intentional; ignore permanently.
      - dependency-name: "jsonpath"
  - package-ecosystem: "npm"
    directory: "/verifiers/javascript"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "OlympusLedgerOrg"
    labels:
      - "dependencies"
      - "security"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - "OlympusLedgerOrg"
    labels:
      - "dependencies"
