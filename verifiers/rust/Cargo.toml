# Standalone workspace root: this crate is intentionally excluded from the
# main workspace (separate build/coverage scope). Declaring an empty
# `[workspace]` here pins it as its own root so `cargo` never walks up into a
# parent workspace — required to build it from a nested git worktree, where the
# main repo's Cargo.toml would otherwise be found and rejected.
[workspace]

[package]
name = "olympus-verifier"
version = "0.1.0"
edition = "2021"
authors = [ "Olympus Contributors" ]
license = "Apache-2.0"
description = "High-performance Rust verifier for Olympus commitments"
repository = "https://github.com/OlympusLedgerOrg/Olympus"
keywords = [ "cryptography", "merkle", "blake3", "verification" ]
# Not published to crates.io: this is an in-repo conformance verifier with a
# `light-poseidon` path dependency. `cargo-deny`'s `allow-wildcard-paths`
# exemption only applies to *private* crates (crates.io forbids path deps), so
# without this the V3 redaction verifier's path dep trips `wildcard = "deny"`.
publish = false

[dependencies]
blake3 = "1.5"
hex = "0.4"
base64 = "0.23"
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"
ed25519-dalek = "2.2.0"
# num-bigint (MIT/Apache-2.0) — big-integer arithmetic for the Baby Jubjub
# Pedersen verifier; the same crate the rest of the workspace already pins.
num-bigint = "0.4"

# Red-team C1 / PR G: Groth16 verifier dependencies. court-evidence.md
# §2 documents `cargo run --release -- verify --circuit ... --proof ... \
# --public-signals ...`; the verify binary needs an independent ark-groth16
# verifier rather than trusting Olympus's desktop crate. Versions pinned to
# the same 0.6 series used by the desktop's `zk::verify` so vkey + proof
# JSON shapes round-trip identically.
#
# Note on the 0.5/0.6 ark mix: `ark-crypto-primitives` 0.6 declares its own
# `ark-crypto-primitives-macros = 0.5` proc-macro dependency upstream. The
# 0.5 proc-macro emits 0.6-compatible code and is a build-time tool (not
# linked into the runtime graph), so patching it locally would risk
# breaking the upstream interface contract. No action needed at our level;
# tracked upstream at <https://github.com/arkworks-rs/crypto-primitives>.
ark-bn254 = "=0.6.0"
ark-groth16 = "=0.6.0"
ark-ff = "=0.6.0"
ark-ec = "=0.6.0"
ark-serialize = "=0.6.0"
ark-snark = "=0.6.0"
thiserror = "2"

# ADR-0030 V3 redaction verifier: Poseidon over BN254. Path dep on the vendored
# (Apache-2.0) light-poseidon — the SAME implementation src-tauri's ZK layer and
# `olympus-crypto`'s `poseidon_hash` agree with byte-for-byte (pinned by an
# olympus-crypto dev test). We deliberately do NOT hand-roll round constants here:
# the genuinely-independent cross-check is the JavaScript verifier's local
# Poseidon/Baby Jubjub implementation; this Rust leg is an independent
# *re-fold + re-verify* of the same vectors.
light-poseidon = { path = "../../crates/light-poseidon" }

# ADR-0040 canonicalization receipt verification. This standalone verifier
# intentionally carries no prover/client features. `disable-dev-mode` makes
# fake receipts unavailable even if a caller sets RISC0_DEV_MODE.
risc0-zkvm = { version = "=3.0.6", default-features = false, features = [
  "std",
  "disable-dev-mode",
] }

# Clap for the verify CLI. OPTIONAL, behind the default-on `cli` feature: it is
# used only by `src/bin/verify.rs`, never by the library. `src-tauri` takes this
# crate as a `default-features = false` dev-dependency for the producer→verifier
# round-trip gate, and a library consumer has no use for an argument parser —
# without the gate, clap + its ANSI stack landed in the desktop lockfile as 13
# crates `cargo vet` then required attestations for. Not adding supply-chain
# surface beats attesting to surface nothing calls.
#
# `default = [ "cli" ]` keeps every existing invocation unchanged, including the
# `cargo run --release -- verify --circuit ...` documented in
# docs/court-evidence.md §2 and this crate's own CI.
clap = { version = "4", features = [ "derive" ], optional = true }

[features]
default = [ "cli" ]
# The `olympus-verifier` command-line binary (`src/bin/verify.rs`). The other
# binary, `hash_batch`, parses `std::env::args` directly and needs nothing here.
cli = [ "dep:clap" ]

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[[bench]]
name = "verification"
harness = false

[[bin]]
name = "olympus-verifier"
path = "src/bin/verify.rs"
# Skips this target when `cli` is off, so `cargo clippy --all-targets` on a
# lib-only consumer does not fail on the unresolved `clap` import.
required-features = [ "cli" ]
