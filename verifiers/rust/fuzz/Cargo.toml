[package]
name = "olympus-verifier-fuzz"
version = "0.0.0"
# Matches the crate this harness fuzzes; without it cargo-deny rejects the
# tree as unlicensed, which is what kept these two out of the policy gate.
license = "Apache-2.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = [ "derive" ] }
ed25519-dalek = "2.2.0"

[dependencies.olympus-verifier]
path = ".."

[[bin]]
name = "fuzz_verify_merkle_proof"
path = "fuzz_targets/fuzz_verify_merkle_proof.rs"
doc = false

[[bin]]
name = "fuzz_compute_merkle_root"
path = "fuzz_targets/fuzz_compute_merkle_root.rs"
doc = false

[[bin]]
name = "fuzz_redaction_bundle"
path = "fuzz_targets/fuzz_redaction_bundle.rs"
doc = false

[workspace]
members = [ "." ]
