<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OLYMPUS_PROTOCØL // PROJECT_MAYHEM</title>
    <!--
      Olympus 18-family type system — exact weights from design handoff.
      Self-hosted: the @font-face rules live in src/styles/fonts.css and the
      .woff2 files in public/fonts/. Do not reinstate a Google Fonts <link>
      here — a launch must make no outbound request, and the Tauri CSP no
      longer whitelists fonts.googleapis.com or fonts.gstatic.com.
      See public/fonts/PROVENANCE.md.
    -->
    <style>
      html, body { margin: 0; padding: 0; background: #050505; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #050505;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.4s ease;
      }
      #splash img { width: 320px; max-width: 80vw; image-rendering: pixelated; }
      #splash.fade-out { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="splash"><img src="/loading.png" alt="Loading…" /></div>
    <div id="root"></div>
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
